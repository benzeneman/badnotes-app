<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A43B8"/><stop offset="1" stop-color="#2B2250"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="930" cy="40" r="190" fill="#9C86F0" opacity=".10"/>
  <circle cx="540" cy="520" r="150" fill="#9C86F0" opacity=".07"/>
  <!-- mark -->
  <g transform="translate(72 118) scale(1.1)">
    <rect width="100" height="100" rx="22" fill="#6E56CF"/>
    <path d="M15 66C21 34 36 29 40 50S52 84 62 52 74 28 84 42" fill="none" stroke="#FFFCEE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="42" r="7.5" fill="#FFE066"/>
  </g>
  <text x="72" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#fff" letter-spacing="-2">BadNotes</text>
  <text x="74" y="352" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="500" fill="#D8CFF5">Write by hand. Keep it yours.</text>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="72" y="388" width="138" height="38" rx="19" fill="#9C86F0" fill-opacity=".18"/>
    <text x="141" y="413" fill="#E7E1FA" text-anchor="middle">Fountain pen</text>
    <rect x="222" y="388" width="116" height="38" rx="19" fill="#9C86F0" fill-opacity=".18"/>
    <text x="280" y="413" fill="#E7E1FA" text-anchor="middle">PDF ink</text>
    <rect x="350" y="388" width="128" height="38" rx="19" fill="#9C86F0" fill-opacity=".18"/>
    <text x="414" y="413" fill="#E7E1FA" text-anchor="middle">Voice notes</text>
  </g>
  <!-- the page -->
  <g transform="rotate(-5 760 250)" filter="url(#sh)">
    <rect x="590" y="52" width="340" height="396" rx="18" fill="#FFFDF6"/>
    <rect x="590" y="52" width="340" height="46" rx="18" fill="#EFEADB"/>
    <rect x="590" y="80" width="340" height="18" fill="#EFEADB"/>
    <g stroke="#DAD3BF" stroke-width="1.5">
      <path d="M612 150H908M612 196H908M612 242H908M612 288H908M612 334H908M612 380H908M612 426H908"/>
    </g>
    <!-- handwriting -->
    <path d="M628 176c18-46 30-18 22 12s14 24 30-8c10-22 24-18 20 4s20 20 34-6c12-20 26-10 22 8s26 14 42-14" fill="none" stroke="#1C2438" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M630 268c34-34 66-34 52-2s30 34 60-4 56-10 40 12 24 26 54-6" fill="none" stroke="#6E56CF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M630 358c60 12 120-20 180-4s60-6 90-14" fill="none" stroke="#1C2438" stroke-width="5.5" stroke-linecap="round" opacity=".85"/>
    <!-- highlighter -->
    <rect x="740" y="228" width="120" height="22" rx="4" fill="#FFE066" opacity=".6"/>
  </g>
  <!-- pen -->
  <g transform="translate(868 330) rotate(36)">
    <rect x="0" y="0" width="22" height="150" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="22" height="26" rx="6" fill="#9C86F0"/>
    <path d="M0 150h22l-11 34z" fill="#4A3699"/>
    <path d="M7 164h8l-4 16z" fill="#9C86F0"/>
  </g>
