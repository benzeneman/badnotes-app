<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder long-press</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #1C1C1E;outline-offset:3px}
.mi:hover{background:#F2F2EF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.48); backdrop-filter: blur(4px)"></div>

  <!-- Lifted folder -->
  <div style="position: absolute; left: 36px; top: 200px; width: 180px; transform: rotate(-2deg)">
    <div style="width: 70px; height: 16px; background: #F0EDFC; border: 1px solid #E7E6E1; border-bottom: none; border-radius: 8px 8px 0 0; margin-bottom: -1px"></div>
    <div style="height: 110px; background: #F0EDFC; border: 1px solid #E7E6E1; border-radius: 0 16px 16px 16px; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 0 3px #FFFFFF, 0 24px 48px rgba(0,0,0,.25)">
      <span style="font-size: 12px; font-weight: 600">12 items</span>
      <span style="font-family: Inter, sans-serif; font-weight: 700; font-size: 21px">College</span>
    </div>
  </div>

  <!-- Menu -->
  <div role="menu" aria-label="Folder options" style="position: absolute; left: 232px; top: 200px; width: 310px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 10px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 10px">
      <span style="width: 34px; height: 34px; border-radius: 10px; background: #F0EDFC; border: 1px solid #E7E6E1; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></span>
      <span><span style="display: block; font-weight: 700; font-size: 15px">College</span><span style="display: block; font-size: 11px; color: #6B6B70">9 notebooks · 3 PDFs</span></span>
    </div>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v1H3z"/><path d="M3 10h18l-2 9H5z"/></svg>Open</button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Rename</button>

    <div style="padding: 8px 12px 10px">
      <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 8px">Folder color</div>
      <div style="display: flex; gap: 8px">
        <button class="rb" aria-label="Lime (current)" style="width: 32px; height: 32px; border-radius: 50%; background: #F0EDFC; border: 1px solid #E7E6E1; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #6E56CF"></button>
        <button class="rb" aria-label="Lilac" style="width: 32px; height: 32px; border-radius: 50%; background: #CFC2F5; border: 1px solid #E7E6E1"></button>
        <button class="rb" aria-label="Sky" style="width: 32px; height: 32px; border-radius: 50%; background: #B9D3F2; border: 1px solid #E7E6E1"></button>
        <button class="rb" aria-label="Coral" style="width: 32px; height: 32px; border-radius: 50%; background: #F2C2B1; border: 1px solid #E7E6E1"></button>
        <button class="rb" aria-label="Mustard" style="width: 32px; height: 32px; border-radius: 50%; background: #EBD69F; border: 1px solid #E7E6E1"></button>
        <button class="rb" aria-label="Teal" style="width: 32px; height: 32px; border-radius: 50%; background: #B5DDD0; border: 1px solid #E7E6E1"></button>
      </div>
    </div>

    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l2.5 5.2 5.5.8-4 3.9.9 5.6L12 16.9 7.1 19.5l.9-5.6-4-3.9 5.5-.8z"/></svg>Add to Starred</button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M10 13h6M13 10l3 3-3 3"/></svg>
      <span style="flex: 1">Move inside…</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>Export folder (.zip)</button>
    <div style="height: 1.5px; background: #EFEEEA; margin: 6px 4px"></div>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; color: #C42F1E">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete folder</button>
  </div>

  <div style="position: absolute; left: 580px; top: 230px; width: 240px; font-family: Inter, sans-serif; font-weight: 500; font-size: 14px; color: #FFFFFF; line-height: 1.1">
    ← color change right inside the menu, no extra screen
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
