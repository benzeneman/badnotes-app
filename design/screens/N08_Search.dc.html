<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #1C1C1E;outline-offset:3px}
.row:hover{background:#F2F2EF}
mark{background:#E9E4FB;color:#4B3A9E;padding:0 2px;border-radius:3px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.5); backdrop-filter: blur(5px)"></div>

  <div role="dialog" aria-label="Search" style="position: absolute; left: 220px; top: 24px; width: 840px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 16px 0 24px; border-bottom: 1.5px solid #EFEEEA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label for="sq" style="position: absolute; left: -9999px">Search</label>
      <input id="sq" value="newton" style="all: unset; flex: 1; font-family: Inter, sans-serif; font-size: 24px; font-weight: 700">
      <button class="rb" style="height: 38px; padding: 0 16px; border-radius: 999px; background: #F2F2EF; font-size: 13px; font-weight: 600; display: flex; align-items: center">Cancel</button>
    </div>
    <div style="display: flex; gap: 8px; padding: 14px 24px">
      <button class="rb" style="height: 34px; padding: 0 14px; border-radius: 999px; background: #F0EDFC; color: #5A43B8; font-size: 12px; font-weight: 700; display: flex; align-items: center">All · 7</button>
      <button class="rb" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 12px; font-weight: 600; display: flex; align-items: center">Handwriting · 4</button>
      <button class="rb" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 12px; font-weight: 600; display: flex; align-items: center">Notebooks · 1</button>
      <button class="rb" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 12px; font-weight: 600; display: flex; align-items: center">Photos · 1</button>
      <button class="rb" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 12px; font-weight: 600; display: flex; align-items: center">Pins · 1</button>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 24px; padding: 4px 24px 24px">
      <div>
        <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin: 6px 0 10px">FOUND IN YOUR HANDWRITING</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <button class="rb" style="display: flex; flex-direction: column; gap: 8px">
            <span style="display: block; height: 150px; border: 1px solid #E7E6E1; border-radius: 10px; background-color: #FFFFFF; background-image: linear-gradient(#D9E1F2 1px, transparent 1px); background-size: 100% 16px; background-position: 0 20px; padding: 12px; box-sizing: border-box; font-family: Caveat, cursive; font-weight: 700; color: #2A4BD0; font-size: 18px; line-height: 16px"><mark>Newton's</mark> 2nd law<br>F = m · a</span>
            <span><span style="display: block; font-size: 13px; font-weight: 600">Physics — p. 12</span><span style="display: block; font-size: 11px; color: #6B6B70">Today</span></span>
          </button>
          <button class="rb" style="display: flex; flex-direction: column; gap: 8px">
            <span style="display: block; height: 150px; border: 1px solid #E7E6E1; border-radius: 10px; background-color: #FFFFFF; background-image: linear-gradient(#D9E1F2 1px, transparent 1px); background-size: 100% 16px; background-position: 0 20px; padding: 12px; box-sizing: border-box; font-family: Caveat, cursive; font-weight: 700; color: #1C1C1E; font-size: 18px; line-height: 16px">1st law —<br>inertia, <mark>Newton</mark><br>example: bus</span>
            <span><span style="display: block; font-size: 13px; font-weight: 600">Physics — p. 9</span><span style="display: block; font-size: 11px; color: #6B6B70">18 Nov</span></span>
          </button>
          <button class="rb" style="display: flex; flex-direction: column; gap: 8px">
            <span style="display: block; height: 150px; border: 1px solid #E7E6E1; border-radius: 10px; background-color: #1C1C1E; background-image: linear-gradient(rgba(110,86,207,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(110,86,207,.12) 1px, transparent 1px); background-size: 14px 14px; padding: 12px; box-sizing: border-box; font-family: Caveat, cursive; font-weight: 700; color: #FFFFFF; font-size: 18px; line-height: 18px">1 N = 1 kg·m/s²<br><mark>newton</mark> (unit)</span>
            <span><span style="display: block; font-size: 13px; font-weight: 600">Maths Formula — p. 30</span><span style="display: block; font-size: 11px; color: #6B6B70">Today</span></span>
          </button>
        </div>

        <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin: 20px 0 6px">PINS &amp; PHOTOS</div>
        <button class="rb row" style="width: 100%; height: 58px; border-radius: 14px; padding: 0 8px; display: flex; align-items: center; gap: 12px">
          <span style="width: 46px; height: 40px; border-radius: 6px; background: #F4F6F2; border: 1px solid #DCDCD4; display: flex; align-items: center; justify-content: center"><svg width="34" height="22" viewBox="0 0 108 70" fill="none" stroke="#2A5BD7" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M10 18c6-6 10 6 16 0M10 56h30M48 56h20"/></svg></span>
          <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 600">Lecture board · 20 Nov</span><span style="display: block; font-size: 12px; color: #6B6B70">Photo — text found: “<mark>Newton</mark> 3rd law”</span></span>
        </button>
      </div>

      <div style="border-left: 1.5px solid #EFEEEA; padding-left: 20px">
        <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin: 6px 0 10px">RECENT SEARCHES</div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <button class="rb row" style="height: 38px; border-radius: 10px; padding: 0 8px; display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>lab file</button>
          <button class="rb row" style="height: 38px; border-radius: 10px; padding: 0 8px; display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>integration formula</button>
          <button class="rb row" style="height: 38px; border-radius: 10px; padding: 0 8px; display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>sandhi</button>
        </div>
        <div style="margin-top: 18px; background: #F2F2EF; border-radius: 16px; padding: 14px; font-size: 12px; line-height: 1.5; color: #3F3F39">
          <span style="font-family: Caveat, cursive; font-weight: 700; font-size: 18px; color: #1C1C1E">tip</span><br>Search reads your handwriting and the text inside photos too.
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
