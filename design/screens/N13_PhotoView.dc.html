<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
.ab:hover{background:#2A2A30}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #0E0E10">
  <div style="position: absolute; inset: 0; opacity: .25"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(14,14,16,.82); backdrop-filter: blur(8px)"></div>

  <!-- top bar -->
  <div style="position: absolute; left: 36px; right: 36px; top: 28px; display: flex; align-items: center; justify-content: space-between">
    <div>
      <div style="font-family: Inter, sans-serif; font-weight: 600; font-size: 22px">Lecture board</div>
      <div style="font-size: 12px; color: #B8B8AF; margin-top: 2px">Photo · 20 Nov, 11:42 AM · 2 of 4 on your board</div>
    </div>
    <button class="rb" aria-label="Close" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- prev / next -->
  <button class="rb" aria-label="Previous photo" style="position: absolute; left: 36px; top: 360px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #4A4A52; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="rb" aria-label="Next photo" style="position: absolute; right: 36px; top: 360px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #4A4A52; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>

  <!-- polaroid -->
  <div style="position: absolute; left: 290px; top: 104px; width: 700px; background: #FFFFFF; padding: 16px 16px 0; box-sizing: border-box; transform: rotate(1deg); box-shadow: 0 30px 60px rgba(0,0,0,.6)">
    <div style="height: 420px; background: #F4F6F2; border: 1px solid #DCDCD4; display: flex; align-items: center; justify-content: center">
      <svg width="560" height="340" viewBox="0 0 108 70" fill="none" stroke-linecap="round" stroke-width="1.6" role="img" aria-label="Photo of a lecture whiteboard with equations"><path d="M10 18c6-6 10 6 16 0M32 18h14M52 12v12M46 18h12" stroke="#2A5BD7"/><path d="M10 38c10-8 18 8 30 0s14-6 22 0" stroke="#D7372A"/><path d="M10 56h30M48 56h20M74 50l10 12M84 50L74 62" stroke="#2A5BD7"/><path d="M70 16h24M70 24h18M70 32h22" stroke="#1F8A70"/></svg>
    </div>
    <div style="font-family: Caveat, cursive; font-weight: 700; font-size: 30px; color: #1C1C1E; padding: 10px 6px 14px">lecture board · 20 Nov</div>
  </div>

  <!-- action bar -->
  <div role="toolbar" aria-label="Photo actions" style="position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; background: #1C1C1E; border-radius: 999px; box-shadow: 0 0 0 1.5px #3A3A40">
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; background: #6E56CF; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>Draw on it</button>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M10 12h5M12.5 9.5v5"/></svg>Add to notebook</button>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Copy text</button>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>Share</button>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M12 12v9M5 3l14 18"/></svg>Unpin</button>
    <button class="rb ab" aria-label="Delete photo" style="width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FF8A7A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
