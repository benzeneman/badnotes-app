<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sync status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #1C1C1E;outline-offset:3px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.38); backdrop-filter: blur(3px)"></div>

  <div style="position: absolute; left: 1160px; top: 28px; width: 40px; height: 40px; border-radius: 12px; background: #F0EDFC; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #FFFFFF">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E56CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4.25 4.25 0 0 0 7 18z"/><path d="M9.5 13.5l2 2 3.5-3.5"/></svg>
  </div>

  <div role="dialog" aria-label="Sync" style="position: absolute; left: 900px; top: 80px; width: 350px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="position: absolute; left: 276px; top: -11px; width: 18px; height: 18px; background: #FFFFFF; border-left: 1px solid #E7E6E1; border-top: 1px solid #E7E6E1; transform: rotate(45deg)"></div>
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 52px; height: 52px; border-radius: 16px; background: #F0EDFC; border: 1px solid #E7E6E1; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      </div>
      <div>
        <div style="font-family: Inter, sans-serif; font-weight: 600; font-size: 20px">All synced</div>
        <div style="font-size: 12px; color: #6B6B70; margin-top: 2px">Last sync 1 min ago · Google Drive</div>
      </div>
    </div>

    <div style="background: #F2F2EF; border-radius: 16px; padding: 14px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600"><span>Cloud storage</span><span>1.2 GB of 5 GB</span></div>
      <div style="height: 10px; border-radius: 99px; background: #FFFFFF; border: 1px solid #E7E6E1; margin-top: 8px; overflow: hidden"><div style="width: 24%; height: 100%; background: #B9D3F2; border-right: 1px solid #E7E6E1"></div></div>
      <div style="display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #3F3F39">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #B9D3F2; border: 1px solid #1C1C1E"></span>12 notebooks</span>
        <span>4 photos</span><span>3 PDFs</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label style="display: flex; align-items: center; justify-content: space-between; height: 40px; font-size: 14px; font-weight: 600">Sync only on Wi-Fi
        <span style="width: 40px; height: 24px; border-radius: 99px; background: #6E56CF; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2)"></span></span>
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; height: 40px; font-size: 14px; font-weight: 600">Auto-sync while writing
        <span style="width: 40px; height: 24px; border-radius: 99px; background: #6E56CF; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2)"></span></span>
      </label>
    </div>

    <div style="display: flex; gap: 8px">
      <button class="rb" style="flex: 1; height: 46px; border-radius: 999px; background: #F0EDFC; border: 1px solid #E7E6E1; box-shadow: 0 10px 30px rgba(0,0,0,.08); font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Sync now</button>
      <button class="rb" style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 14px; font-weight: 600; display: flex; align-items: center">Settings</button>
    </div>
  </div>

  <div style="position: absolute; left: 900px; top: 560px; width: 350px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 18px; padding: 12px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
    <span style="font-size: 11px; font-weight: 700; color: #6B6B70; letter-spacing: .8px">IF OFFLINE →</span>
    <span style="width: 10px; height: 10px; border-radius: 50%; background: #FFB547; border: 1px solid #1C1C1E"></span>
    <span style="font-size: 13px; font-weight: 600">3 changes waiting to sync</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
