<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whiteboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;family=Lora:wght@500;700&amp;family=JetBrains+Mono:wght@500&amp;family=Nunito:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E56CF;text-decoration:none}a:hover{color:#5A43B8}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #6E56CF;outline-offset:3px}
.pop{position:absolute;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:18px;box-shadow:0 2px 4px rgba(0,0,0,.04),0 18px 48px rgba(0,0,0,.12);padding:16px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#1C1C1E}
.pt{font-family:Inter,sans-serif;font-weight:600;font-size:15px;margin:0;letter-spacing:-.1px}
.ps{font-size:12px;color:#6B6B70;margin-top:2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lab{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6B6B70;margin-top:14px}
.sl{position:relative;height:22px;margin-top:4px}
.sl .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:#E7E6E1}
.sl .fi{position:absolute;left:0;top:9px;height:4px;border-radius:99px;background:#6E56CF}
.sl .kn{position:absolute;top:1px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
.tg{width:40px;height:24px;border-radius:99px;background:#E2E1DC;position:relative;display:inline-block;flex:none}
.tg i{position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:#6E56CF}
.tg.on i{left:18px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;font-size:13px;font-weight:500}
.ds{font-size:12px;color:#6B6B70;line-height:1.45;margin:-4px 0 6px}
.sep{height:1px;background:#EFEEEA;margin:10px 0}
.sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:#EDEDEA;border-radius:10px}
.sg .rb{height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#55555A}
.sg .rb.on{background:#FFFFFF;color:#1C1C1E;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:64px;border-radius:12px;font-size:12px;font-weight:500;color:#3A3A3F}
.ty.on{background:#F0EDFC;color:#5A43B8;font-weight:600}
.pv{height:80px;border-radius:12px;background:#F6F6F4;display:flex;align-items:center;justify-content:center;margin-top:12px}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:40px;border-radius:10px;padding:0 10px;font-size:13px;font-weight:500;color:#1C1C1E}
.mi:hover{background:#F4F4F1}
.sub{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);font-family:Inter,sans-serif;color:#1C1C1E}
.sb{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#3A3A3F}
.sb.on{background:#F2F2EF}
.pill{height:32px;padding:0 10px;border-radius:9px;background:#F0EDFC;color:#5A43B8;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.vs{width:1px;height:18px;background:#E7E6E1;margin:0 6px}
.sw{width:22px;height:22px;margin:0 4px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px #6E56CF}
.note{position:absolute;font-family:Inter,sans-serif;font-weight:400;font-size:13px;line-height:1.45;color:#3A3A3F;background:#FFFFFF;padding:12px 14px;border:1px solid #E7E6E1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.dim{position:absolute;inset:0;background:rgba(20,20,22,.28);backdrop-filter:blur(4px)}
.chip{height:30px;padding:0 12px;border-radius:8px;border:1px solid #E7E6E1;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:#FFFFFF;color:#3A3A3F}
.chip.on{background:#F0EDFC;color:#5A43B8;border-color:#E0D9FA;font-weight:600}
.btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid #E7E6E1;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#FFFFFF;color:#1C1C1E}
.btn.go{background:#6E56CF;border-color:#6E56CF;color:#FFFFFF;font-weight:600}
.red{color:#D93A2B}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
<div style="position: absolute; inset: 0"><dc-import name="M_Editor" tool="pen" show-sub="true" show-pop="false" hint-size="1280px,800px"></dc-import></div>
<div style="position: absolute; left: 0; right: 0; top: 60px; bottom: 0; background: radial-gradient(#D9D8D2 1.2px, transparent 1.4px) 0 0 / 24px 24px, #F9F9F7"></div>
<div style="position: absolute; left: 120px; top: 140px; width: 150px; height: 120px; background: #FFF4CC; border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.08); padding: 12px; box-sizing: border-box; font: 700 20px/1.05 Caveat, cursive">dark mode for editor</div>
<div style="position: absolute; left: 300px; top: 180px; width: 150px; height: 120px; background: #E9F1FB; border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.08); padding: 12px; box-sizing: border-box; font: 700 20px/1.05 Caveat, cursive">cover library</div>
<svg width="460" height="260" viewBox="0 0 460 260" fill="none" style="position: absolute; left: 140px; top: 330px" aria-hidden="true"><circle cx="230" cy="130" r="56" fill="#F0EDFC" stroke="#6E56CF" stroke-width="2"/><text x="230" y="137" text-anchor="middle" style="font: 700 24px Caveat, cursive" fill="#1C1C1E">BadNotes v2</text><path d="M180 100L70 40M280 100l110-60M180 160L70 220M280 160l110 60" stroke="#6B6B70" stroke-width="2" stroke-linecap="round"/></svg>
<div style="position: absolute; left: 16px; top: 12px; height: 40px; display: flex; align-items: center; gap: 10px"><span style="font-size: 14px; font-weight: 600">Project brainstorm</span><span class="chip">Whiteboard</span></div>
<aside class="pop" aria-label="Paper and layouts" style="right: 16px; top: 64px; width: 330px">
  <h2 class="pt">Paper and layouts</h2>
  <div class="lab"><span>Paper</span><span></span></div>
  <div style="display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap"><button class="rb chip on">Dots</button><button class="rb chip">Grid</button><button class="rb chip">Lines</button><button class="rb chip">Plain</button><button class="rb chip">Chalkboard</button></div>
  <div class="lab"><span>Ready-made layouts</span><span></span></div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 6px"><button class="rb" style="display: flex; flex-direction: column; gap: 6px; text-align: left"><span style="display: flex; height: 70px; border-radius: 10px; border: 1px solid #E7E6E1; background: #FFFFFF; align-items: center; justify-content: center"><svg width="90" height="50" viewBox="0 0 90 50" fill="none" stroke="#B4B4B8" aria-hidden="true"><rect x="3" y="3" width="26" height="44" rx="3"/><rect x="32" y="3" width="26" height="44" rx="3"/><rect x="61" y="3" width="26" height="44" rx="3"/><rect x="7" y="9" width="18" height="8" rx="2" fill="#E6DEFB" stroke="none"/><rect x="36" y="9" width="18" height="8" rx="2" fill="#DCEFE9" stroke="none"/></svg></span><span class="mut" style="font-size: 11px">Kanban</span></button><button class="rb" style="display: flex; flex-direction: column; gap: 6px; text-align: left"><span style="display: flex; height: 70px; border-radius: 10px; border: 1px solid #E7E6E1; background: #FFFFFF; align-items: center; justify-content: center"><svg width="90" height="50" viewBox="0 0 90 50" fill="none" stroke="#B4B4B8" aria-hidden="true"><circle cx="45" cy="25" r="9" fill="#F0EDFC"/><path d="M36 22L14 10M54 22l22-12M36 28L14 40M54 28l22 12"/></svg></span><span class="mut" style="font-size: 11px">Mind map</span></button><button class="rb" style="display: flex; flex-direction: column; gap: 6px; text-align: left"><span style="display: flex; height: 70px; border-radius: 10px; border: 1px solid #E7E6E1; background: #FFFFFF; align-items: center; justify-content: center"><svg width="90" height="50" viewBox="0 0 90 50" fill="none" stroke="#B4B4B8" aria-hidden="true"><rect x="3" y="3" width="40" height="20" rx="3" fill="#DCEFE9"/><rect x="47" y="3" width="40" height="20" rx="3" fill="#FBE3DA"/><rect x="3" y="27" width="40" height="20" rx="3" fill="#E3EDFB"/><rect x="47" y="27" width="40" height="20" rx="3" fill="#F7ECCF"/></svg></span><span class="mut" style="font-size: 11px">SWOT</span></button><button class="rb" style="display: flex; flex-direction: column; gap: 6px; text-align: left"><span style="display: flex; height: 70px; border-radius: 10px; border: 1px solid #E7E6E1; background: #FFFFFF; align-items: center; justify-content: center"><svg width="90" height="50" viewBox="0 0 90 50" fill="none" stroke="#B4B4B8" aria-hidden="true"><path d="M5 25h80"/><circle cx="18" cy="25" r="4" fill="#6E56CF" stroke="none"/><circle cx="45" cy="25" r="4" fill="#6E56CF" stroke="none"/><circle cx="72" cy="25" r="4" fill="#6E56CF" stroke="none"/></svg></span><span class="mut" style="font-size: 11px">Timeline</span></button></div>
  <div class="ds" style="margin-top: 10px">Drops on the board like a picture — move it with the lasso and write on top.</div>
</aside>
</div>
</x-dc>
