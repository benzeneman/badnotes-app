body{margin:0}
a{color:#6E56CF;text-decoration:none}a:hover{color:#5A43B8}
.rb{all:unset;box-sizing:border-box;cursor:pointer}

.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}

.sl .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:#E7E6E1}

.vs{width:1px;height:18px;background:#E7E6E1;margin:0 6px}
.sw{width:22px;height:22px;margin:0 4px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px #6E56CF}
.note{position:absolute;font-family:Inter,sans-serif;font-weight:400;font-size:13px;line-height:1.45;color:#3A3A3F;background:#FFFFFF;padding:12px 14px;border:1px solid #E7E6E1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.dim{position:absolute;inset:0;background:rgba(20,20,22,.28);backdrop-filter:blur(4px)}

.chip.on{background:#F0EDFC;color:#5A43B8;border-color:#E0D9FA;font-weight:600}
.btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid #E7E6E1;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#FFFFFF;color:#1C1C1E}
.btn.go{background:#6E56CF;border-color:#6E56CF;color:#FFFFFF;font-weight:600}
.red{color:#D93A2B}

.card{background:#FFFFFF;border:1px solid #E7E6E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.8px}
.h2{margin:0;font-size:15px;font-weight:600}
.mut{font-size:12px;color:#6B6B70}
.t{font-size:13px;font-weight:600}

.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.08)}
.cl{position:absolute;left:18px;bottom:12px;font-size:12px;font-weight:600;color:rgba(28,28,30,.75)}
.fd{position:relative;display:block;height:104px}
.ftab{position:absolute;left:0;top:0;width:64px;height:20px;border-radius:10px 10px 0 0}
.fback{position:absolute;left:0;right:0;top:12px;bottom:0;border-radius:0 12px 12px 12px}
.pk{position:absolute;top:18px;width:36px;height:48px;border-radius:2px 5px 5px 2px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ffront{position:absolute;left:0;right:0;bottom:0;height:56px;border-radius:12px;padding:0 14px 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 -1px 0 rgba(255,255,255,.7) inset,0 -4px 10px rgba(0,0,0,.05)}
.dk{height:44px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3A3A3F}
.lr{display:flex;align-items:center;gap:14px;height:64px;padding:0 16px;border-bottom:1px solid #F0EFEB}
