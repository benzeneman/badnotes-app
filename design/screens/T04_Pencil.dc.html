<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pencil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;family=Lora:wght@500;700&amp;family=JetBrains+Mono:wght@500&amp;family=Nunito:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E56CF;text-decoration:none}a:hover{color:#5A43B8}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #6E56CF;outline-offset:3px}
.pop{position:absolute;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:18px;box-shadow:0 2px 4px rgba(0,0,0,.04),0 18px 48px rgba(0,0,0,.12);padding:16px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#1C1C1E}
.pt{font-family:Inter,sans-serif;font-weight:600;font-size:15px;margin:0;letter-spacing:-.1px}
.ps{font-size:12px;color:#6B6B70;margin-top:2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lab{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6B6B70;margin-top:14px}
.sl{position:relative;height:22px;margin-top:4px}
.sl .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:#E7E6E1}
.sl .fi{position:absolute;left:0;top:9px;height:4px;border-radius:99px;background:#6E56CF}
.sl .kn{position:absolute;top:1px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
.tg{width:40px;height:24px;border-radius:99px;background:#E2E1DC;position:relative;display:inline-block;flex:none}
.tg i{position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:#6E56CF}
.tg.on i{left:18px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;font-size:13px;font-weight:500}
.ds{font-size:12px;color:#6B6B70;line-height:1.45;margin:-4px 0 6px}
.sep{height:1px;background:#EFEEEA;margin:10px 0}
.sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:#EDEDEA;border-radius:10px}
.sg .rb{height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#55555A}
.sg .rb.on{background:#FFFFFF;color:#1C1C1E;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:64px;border-radius:12px;font-size:12px;font-weight:500;color:#3A3A3F}
.ty.on{background:#F0EDFC;color:#5A43B8;font-weight:600}
.pv{height:80px;border-radius:12px;background:#F6F6F4;display:flex;align-items:center;justify-content:center;margin-top:12px}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:40px;border-radius:10px;padding:0 10px;font-size:13px;font-weight:500;color:#1C1C1E}
.mi:hover{background:#F4F4F1}
.sub{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);font-family:Inter,sans-serif;color:#1C1C1E}
.sb{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#3A3A3F}
.sb.on{background:#F2F2EF}
.pill{height:32px;padding:0 10px;border-radius:9px;background:#F0EDFC;color:#5A43B8;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.vs{width:1px;height:18px;background:#E7E6E1;margin:0 6px}
.sw{width:22px;height:22px;margin:0 4px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px #6E56CF}
.note{position:absolute;font-family:Inter,sans-serif;font-weight:400;font-size:13px;line-height:1.45;color:#3A3A3F;background:#FFFFFF;padding:12px 14px;border:1px solid #E7E6E1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.dim{position:absolute;inset:0;background:rgba(20,20,22,.28);backdrop-filter:blur(4px)}
.chip{height:30px;padding:0 12px;border-radius:8px;border:1px solid #E7E6E1;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:#FFFFFF;color:#3A3A3F}
.chip.on{background:#F0EDFC;color:#5A43B8;border-color:#E0D9FA;font-weight:600}
.btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid #E7E6E1;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#FFFFFF;color:#1C1C1E}
.btn.go{background:#6E56CF;border-color:#6E56CF;color:#FFFFFF;font-weight:600}
.red{color:#D93A2B}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
<div style="position: absolute; inset: 0"><dc-import name="M_Editor" tool="pencil" show-sub="false" show-pop="false" hint-size="1280px,800px"></dc-import></div>
<div class="sub" role="toolbar" aria-label="Pencil options">
  <button class="rb pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/></svg>Pencil<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><span class="vs"></span>
  <button class="rb sb on" aria-label="Size 1"><span style="width: 5px; height: 5px; border-radius: 50%; background: #1C1C1E"></span></button><button class="rb sb" aria-label="Size 2"><span style="width: 9px; height: 9px; border-radius: 50%; background: #1C1C1E"></span></button><button class="rb sb" aria-label="Size 3"><span style="width: 14px; height: 14px; border-radius: 50%; background: #1C1C1E"></span></button><span class="vs"></span>
  <button class="rb sw on" aria-label="Color #4A4A52" style="background: #4A4A52"></button><button class="rb sw" aria-label="Color #1C1C1E" style="background: #1C1C1E"></button><button class="rb sw" aria-label="Color #2A4BD0" style="background: #2A4BD0"></button><button class="rb sw" aria-label="Color #D7372A" style="background: #D7372A"></button><button class="rb sw" aria-label="Color #8A5A3C" style="background: #8A5A3C"></button><button class="rb sw" aria-label="All colors" style="border: 1.5px dashed #CFCEC8; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="pop" style="left: 380px; bottom: 166px; width: 320px">
  <h2 class="pt">Pencil</h2><div class="ps">Grainy, soft — great for sketches</div>
  <div class="pv"><svg width="260" height="56" viewBox="0 0 260 56" fill="none" stroke-linecap="round" aria-hidden="true"><path d="M10 40C50 4 90 4 130 28s80 24 120-6" stroke="#4A4A52" stroke-width="3" stroke-dasharray="1.5 1.2"/><path d="M11 42C51 6 91 6 131 30s80 24 120-6" stroke="#4A4A52" stroke-width="1.6" stroke-dasharray="0.8 2" opacity=".7"/></svg></div>
  <div class="lab"><span>Strength</span><span>100%</span></div><div class="sl"><div class="tr"></div><div class="fi" style="width: 100%"></div><div class="kn" style="left: 100%"></div></div>
  <div class="sep"></div>
  <div class="rw"><span>Faster ink</span><button class="rb tg on" role="switch" aria-checked="true" aria-label="Toggle"><i></i></button></div>
  <div class="ds">Draws a quick preview first, then the full texture.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
