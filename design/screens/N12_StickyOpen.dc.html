<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticky note opened</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
.ab:hover{background:#2A2A30}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.6); backdrop-filter: blur(6px)"></div>

  <!-- Big sticky -->
  <div style="position: absolute; left: 400px; top: 90px; width: 480px; height: 440px; background: #FFF4CC; transform: rotate(-2deg); box-shadow: 0 30px 50px rgba(0,0,0,.45); padding: 54px 44px 30px; box-sizing: border-box">
    <div style="position: absolute; left: 50%; top: -10px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #FF5A36; box-shadow: 0 3px 4px rgba(0,0,0,.4)"></div>
    <div style="font-family: Caveat, cursive; font-weight: 700; font-size: 48px; line-height: 1.05">Exam 28 Nov!<br>revise Ch 4–6</div>
    <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px; font-family: Caveat, cursive; font-weight: 700; font-size: 30px">
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 24px; height: 24px; border: 2.5px solid #1C1C1E; border-radius: 6px; background: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFF4CC" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span><span style="text-decoration: line-through; opacity: .55">Ch 4 — motion</span></div>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 24px; height: 24px; border: 2.5px solid #1C1C1E; border-radius: 6px; box-sizing: border-box"></span>Ch 5 — laws of motion</div>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 24px; height: 24px; border: 2.5px solid #1C1C1E; border-radius: 6px; box-sizing: border-box"></span>Ch 6 — work &amp; energy</div>
    </div>
    <div style="position: absolute; left: 44px; bottom: 22px; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; color: #3F3F39">Pinned 20 Nov · linked to Physics — Class 12</div>
  </div>

  <!-- Action bar -->
  <div role="toolbar" aria-label="Note actions" style="position: absolute; left: 50%; top: 580px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; background: #1C1C1E; border-radius: 999px; color: #FFFFFF; box-shadow: 0 0 0 1.5px #3A3A40">
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Edit</button>
    <div style="display: flex; gap: 6px; padding: 0 10px">
      <button class="rb" aria-label="Lime" style="width: 24px; height: 24px; border-radius: 50%; background: #FFF4CC; box-shadow: 0 0 0 2px #1C1C1E, 0 0 0 3.5px #FFFFFF"></button>
      <button class="rb" aria-label="Peach" style="width: 24px; height: 24px; border-radius: 50%; background: #FDE7E1"></button>
      <button class="rb" aria-label="Sky" style="width: 24px; height: 24px; border-radius: 50%; background: #E9F1FB"></button>
      <button class="rb" aria-label="Lilac" style="width: 24px; height: 24px; border-radius: 50%; background: #EEEAFC"></button>
    </div>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M10 12h5M12.5 9.5v5"/></svg>Add to notebook</button>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="8"/><path d="M12 5v4l3 2"/><path d="M8 21h8"/></svg>Remind me</button>
    <button class="rb ab" style="height: 46px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M12 12v9M5 3l14 18"/></svg>Unpin</button>
    <button class="rb ab" aria-label="Delete note" style="width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FF8A7A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>

  <button class="rb" aria-label="Close" style="position: absolute; right: 36px; top: 30px; width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E7E6E1; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
