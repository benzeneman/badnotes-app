<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinboard quick note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #1C1C1E;outline-offset:3px}
.tb:hover{background:#E9E9E2}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.42); backdrop-filter: blur(3px)"></div>

  <!-- highlighted + on the pinboard -->
  <div style="position: absolute; left: 1196px; top: 198px; width: 28px; height: 28px; border-radius: 50%; background: #F0EDFC; color: #5A43B8; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #FFFFFF">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>

  <!-- Composer -->
  <div role="dialog" aria-label="Quick note" style="position: absolute; left: 830px; top: 240px; width: 380px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="position: absolute; right: 40px; top: -11px; width: 18px; height: 18px; background: #FFFFFF; border-left: 1px solid #E7E6E1; border-top: 1px solid #E7E6E1; transform: rotate(45deg)"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-family: Inter, sans-serif; font-weight: 600; font-size: 18px">Quick note</div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="5">
          <button class="rb" aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 24px; height: 24px; border-radius: 50%; background: {{c.hex}}; border: 1px solid #E7E6E1; box-shadow: {{c.ring}}"></button>
        </sc-for>
      </div>
    </div>

    <div style="position: relative; background: {{color}}; padding: 26px 18px 14px; transform: rotate(-1.5deg); box-shadow: 0 8px 16px rgba(22,22,26,.25)">
      <div style="position: absolute; left: 50%; top: -7px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #FF5A36; box-shadow: 0 2px 3px rgba(0,0,0,.4)"></div>
      <label for="qn" style="position: absolute; left: -9999px">Note text</label>
      <textarea id="qn" value="{{text}}" onChange="{{onText}}" style="all: unset; display: block; width: 100%; height: 130px; font-family: Caveat, cursive; font-weight: 700; font-size: 26px; line-height: 1.1; white-space: pre-wrap"></textarea>
    </div>

    <div style="display: flex; align-items: center; gap: 6px">
      <button class="rb tb" aria-label="Checklist" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F2EF; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l2 2 3-3M4 14l2 2 3-3M12 7h8M12 15h8"/></svg></button>
      <button class="rb tb" aria-label="Add photo" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F2EF; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="rb tb" aria-label="Handwrite" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F2EF; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button>
      <button class="rb tb" aria-label="Link to notebook" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F2EF; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg></button>
      <button class="rb" style="margin-left: auto; height: 44px; padding: 0 20px; border-radius: 999px; background: #F0EDFC; border: 1px solid #E7E6E1; box-shadow: 0 10px 30px rgba(0,0,0,.08); font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M12 12v9"/></svg>Pin it</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { c: 0, text: 'call Rohan about\nlab file — Monday' };
  }
  renderVals() {
    const C = [['Butter', '#FFF4CC'], ['Peach', '#FDE7E1'], ['Sky', '#E9F1FB'], ['Lilac', '#EEEAFC'], ['Mint', '#E2F3EC']];
    const s = this.state;
    return {
      text: s.text,
      onText: (e) => this.setState({ text: e.target.value }),
      color: C[s.c][1],
      colors: C.map((c, i) => ({ label: c[0], hex: c[1], ring: i === s.c ? '0 0 0 2px #FFFFFF, 0 0 0 3.5px #6E56CF' : 'none', pick: () => this.setState({ c: i }) }))
    };
  }
}
</script>
</body>
</html>
