<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BadNotes Home — Minimal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E56CF;text-decoration:none}a:hover{color:#5A43B8}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #6E56CF;outline-offset:3px}
.card{background:#FFFFFF;border:1px solid #E7E6E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.1px}
.mut{font-size:12px;color:#6B6B70}
.nb{display:flex;flex-direction:column;gap:10px}
.cv{position:relative;height:176px;border-radius:4px 12px 12px 4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.08);overflow:hidden}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.08)}
.cl{position:absolute;left:20px;bottom:14px;font-size:12px;font-weight:600;color:rgba(28,28,30,.75)}
.t{font-size:13px;font-weight:600}
.fd{position:relative;display:block;height:104px}
.ftab{position:absolute;left:0;top:0;width:64px;height:20px;border-radius:10px 10px 0 0}
.fback{position:absolute;left:0;right:0;top:12px;bottom:0;border-radius:0 12px 12px 12px}
.pk{position:absolute;top:18px;width:36px;height:48px;border-radius:2px 5px 5px 2px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ffront{position:absolute;left:0;right:0;bottom:0;height:56px;border-radius:12px;padding:0 14px 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 -1px 0 rgba(255,255,255,.7) inset,0 -4px 10px rgba(0,0,0,.05)}
.dk{height:44px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3A3A3F}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; box-sizing: border-box; padding: 26px 40px 0; background: #F6F6F4; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #6E56CF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l3.5-1L19 7.5 16.5 5 6 15.5z"/></svg>
      </div>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -.3px">BadNotes</span>
    </div>
    <label style="flex: 0 1 420px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #EDEDEA; border-radius: 12px; color: #6B6B70; font-size: 13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input placeholder="Search notes, handwriting, photos" aria-label="Search" style="all: unset; flex: 1; font-size: 13px; color: #1C1C1E">
    </label>
    <div style="display: flex; align-items: center; gap: 6px">
      <button class="rb" aria-label="Synced" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3A3A3F">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4.25 4.25 0 0 0 7 18z"/><path d="M9.5 13.5l2 2 3.5-3.5"/></svg></button>
      <button class="rb" aria-label="Profile" style="width: 34px; height: 34px; border-radius: 50%; background: #E9E4FB; color: #5A43B8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">W</button>
    </div>
  </header>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 30px">
    <div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.8px">Good afternoon</h1>
      <p class="mut" style="margin: 6px 0 0; font-size: 13px">6 notebooks · 4 folders · last edited 2 min ago</p>
    </div>
    <div style="display: flex; gap: 2px; padding: 3px; background: #EDEDEA; border-radius: 10px">
      <button class="rb" style="height: 30px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.08); font-size: 12px; font-weight: 600">All</button>
      <button class="rb" style="height: 30px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #55555A">Notebooks</button>
      <button class="rb" style="height: 30px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #55555A">Folders</button>
      <button class="rb" style="height: 30px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #55555A">Photos</button>
      <button class="rb" style="height: 30px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #55555A">Favorites</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; margin-top: 26px">
    <div style="display: flex; flex-direction: column; gap: 28px; min-width: 0">
      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px"><h2 class="h2">Folders</h2><a href="#" style="font-size: 12px; font-weight: 500">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
          <button class="rb fd"><span class="ftab" style="background: #CFC2F5"></span><span class="fback" style="background: #CFC2F5"></span><span class="pk" style="left: 26px; background: #E8E1FB; transform: rotate(-7deg)"></span><span class="pk" style="left: 64px; background: #2B2B30; transform: rotate(5deg)"></span><span class="ffront" style="background: #E6DEFB"><span style="position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A43B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6"/></svg></span><span class="t">College</span><span class="mut">12 items</span></span></button>
          <button class="rb fd"><span class="ftab" style="background: #F2C2B1"></span><span class="fback" style="background: #F2C2B1"></span><span class="pk" style="left: 30px; background: #FFFFFF; transform: rotate(-5deg)"></span><span class="pk" style="left: 66px; background: #FBE3DA; transform: rotate(6deg)"></span><span class="ffront" style="background: #FBE3DA"><span style="position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9502F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg></span><span class="t">Personal</span><span class="mut">7 items</span></span></button>
          <button class="rb fd"><span class="ftab" style="background: #B5DDD0"></span><span class="fback" style="background: #B5DDD0"></span><span class="pk" style="left: 28px; background: #F7ECCF; transform: rotate(-6deg)"></span><span class="pk" style="left: 64px; background: #FFFFFF; transform: rotate(4deg)"></span><span class="ffront" style="background: #DCEFE9"><span style="position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A7660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h18v11H3zM9 8V5h6v3M3 13h18"/></svg></span><span class="t">Work</span><span class="mut">9 items</span></span></button>
          <button class="rb fd"><span class="ftab" style="background: #EBD69F"></span><span class="fback" style="background: #EBD69F"></span><span class="pk" style="left: 40px; background: #FFFFFF; transform: rotate(-4deg)"></span><span class="ffront" style="background: #F7ECCF"><span style="position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E611A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 15h9"/></svg></span><span class="t">test</span><span class="mut">2 items</span></span></button>
          <button class="rb fd" style="border: 1.5px dashed #CFCEC8; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #6B6B70; font-size: 12px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New folder</button>
        </div>
      </section>

      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px"><h2 class="h2">Notebooks</h2>
          <button class="rb" style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #55555A">Recent<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px">
          <button class="rb nb"><span class="cv" style="display: block; background: #E8E1FB"><span class="cl">Physics</span></span><span><span class="t" style="display: block">Physics — Class 12</span><span class="mut">Today</span></span></button>
          <button class="rb nb"><span class="cv" style="display: block; background: #2B2B30"><span class="cl" style="color: rgba(255,255,255,.8)">Maths</span><svg width="14" height="14" viewBox="0 0 24 24" fill="#F2D59B" style="position: absolute; right: 12px; top: 12px" role="img" aria-label="Favorites"><path d="M12 4l2.5 5.2 5.5.8-4 3.9.9 5.6L12 16.9 7.1 19.5l.9-5.6-4-3.9 5.5-.8z"/></svg></span><span><span class="t" style="display: block">Maths Formula Book</span><span class="mut">Today</span></span></button>
          <button class="rb nb"><span class="cv" style="display: block; background: #FBE3DA"><span class="cl">Journal</span></span><span><span class="t" style="display: block">Daily Journal</span><span class="mut">Yesterday</span></span></button>
          <button class="rb nb"><span class="cv" style="display: block; background: #DCEFE9"><span class="cl">हिंदी</span></span><span><span class="t" style="display: block">Hindi Vyakaran</span><span class="mut">19 Nov</span></span></button>
          <button class="rb nb"><span class="cv" style="display: block; background: #F7ECCF"><span class="cl">Ideas</span></span><span><span class="t" style="display: block">Project Ideas</span><span class="mut">18 Nov</span></span></button>
          <button class="rb nb"><span class="cv" style="display: block; background: #FFFFFF; border: 1px solid #E7E6E1; box-sizing: border-box"><span class="cl" style="color: #8A8A90">Untitled</span></span><span><span class="t" style="display: block">26-11-21 Untitled</span><span class="mut">Today, 1:51 PM</span></span></button>
        </div>
      </section>
    </div>

    <aside class="card" style="padding: 16px; height: 500px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 class="h2">Quick notes</h2>
        <button class="rb" aria-label="Add quick note" style="width: 28px; height: 28px; border-radius: 8px; background: #F0EDFC; color: #6E56CF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #FFF4CC; border-radius: 10px; padding: 12px; height: 104px; box-sizing: border-box; font: 700 19px/1.05 Caveat, cursive">Exam 28 Nov — revise Ch 4–6</div>
        <div style="border-radius: 10px; overflow: hidden; border: 1px solid #E7E6E1; height: 104px; display: flex; flex-direction: column">
          <div style="flex: 1; background: #F3F4F1; display: flex; align-items: center; justify-content: center"><svg width="90" height="50" viewBox="0 0 108 70" fill="none" stroke-linecap="round" stroke-width="2.6" role="img" aria-label="Photo of a lecture whiteboard"><path d="M10 18c6-6 10 6 16 0M32 18h14M52 12v12M46 18h12" stroke="#3B5BDB"/><path d="M10 40c10-8 18 8 30 0s14-6 22 0" stroke="#E03131"/><path d="M10 58h30M48 58h20" stroke="#3B5BDB"/></svg></div>
          <div style="padding: 6px 10px; font-size: 11px; color: #6B6B70">Lecture board</div></div>
        <div style="background: #FDE7E1; border-radius: 10px; padding: 12px; height: 104px; box-sizing: border-box; font: 700 19px/1.05 Caveat, cursive">fix sync bug in BadNotes</div>
        <div style="border-radius: 10px; overflow: hidden; height: 104px; position: relative; background: #F6C9B4">
          <div style="position: absolute; left: 50px; top: 20px; width: 24px; height: 24px; border-radius: 50%; background: #FFF1C9"></div>
          <svg width="140" height="44" viewBox="0 0 124 50" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; width: 100%" role="img" aria-label="Photo of a sunset"><path d="M0 50V30c18-14 34-14 50-2s30 10 44-6 30-6 30-6v34z" fill="#7A5C6E"/></svg></div>
      </div>
      <div style="background: #E9F1FB; border-radius: 10px; padding: 12px; font: 700 19px/1.05 Caveat, cursive">buy pencil tips · try lasso idea</div>
      <div class="mut" style="margin-top: auto; text-align: center">Pin anything here for quick access</div>
    </aside>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px; background: rgba(255,255,255,.92); border: 1px solid #E7E6E1; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.08); backdrop-filter: blur(12px)">
    <button class="rb dk" style="background: #F0EDFC; color: #5A43B8; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Desk</button>
    <button class="rb dk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Recent</button>
    <button class="rb dk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l2.5 5.2 5.5.8-4 3.9.9 5.6L12 16.9 7.1 19.5l.9-5.6-4-3.9 5.5-.8z"/></svg>Favorites</button>
    <button class="rb dk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>Whiteboard</button>
    <span style="width: 1px; height: 22px; background: #E7E6E1; margin: 0 6px"></span>
    <button class="rb dk" style="background: #6E56CF; color: #FFFFFF; font-weight: 600; padding: 0 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
