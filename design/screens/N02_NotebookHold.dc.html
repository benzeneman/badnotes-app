<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook long-press</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #1C1C1E;outline-offset:3px}
.mi:hover{background:#F2F2EF}
.qa:hover{background:#E9E9E2}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.48); backdrop-filter: blur(4px)"></div>

  <!-- Lifted notebook -->
  <div style="position: absolute; left: 34px; top: 366px; width: 150px; transform: rotate(-3deg)">
    <div style="position: relative; height: 210px; border: 1px solid #E7E6E1; border-radius: 6px 14px 14px 6px; overflow: hidden; background: #E8E1FB; box-shadow: 0 0 0 3px #6E56CF, 0 24px 48px rgba(0,0,0,.25)">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 13px; background: rgba(22,22,26,.22)"></div>
      <div style="position: absolute; left: 24px; right: 10px; bottom: 14px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 8px; padding: 6px 8px; font-family: Inter, sans-serif; font-weight: 700; font-size: 14px">Physics</div>
    </div>
    <div style="margin-top: 14px; color: #FFFFFF; font-size: 14px; font-weight: 700">Physics — Class 12</div>
  </div>

  <!-- Context menu -->
  <div role="menu" aria-label="Notebook options" style="position: absolute; left: 212px; top: 214px; width: 300px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 10px; box-sizing: border-box">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <button class="rb qa" role="menuitem" style="height: 64px; border-radius: 14px; background: #F2F2EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l2.5 5.2 5.5.8-4 3.9.9 5.6L12 16.9 7.1 19.5l.9-5.6-4-3.9 5.5-.8z"/></svg>Star</button>
      <button class="rb qa" role="menuitem" style="height: 64px; border-radius: 14px; background: #F2F2EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M12 12v9"/></svg>Pin</button>
      <button class="rb qa" role="menuitem" style="height: 64px; border-radius: 14px; background: #F2F2EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>Share</button>
      <button class="rb qa" role="menuitem" style="height: 64px; border-radius: 14px; background: #F2F2EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copy</button>
    </div>
    <div style="height: 1.5px; background: #EFEEEA; margin: 10px 4px 6px"></div>

    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M6 3v18"/></svg>Open</button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Rename</button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="10" r="1.2" fill="#1C1C1E"/><circle cx="14" cy="9" r="1.2" fill="#1C1C1E"/><circle cx="15.5" cy="13.5" r="1.2" fill="#1C1C1E"/></svg>
      <span style="flex: 1">Change cover</span>
      <span style="display: flex; gap: 3px"><span style="width: 12px; height: 16px; border-radius: 2px 4px 4px 2px; background: #FF8A6B; border: 1px solid #1C1C1E"></span><span style="width: 12px; height: 16px; border-radius: 2px 4px 4px 2px; background: #C9B6FF; border: 1px solid #1C1C1E"></span><span style="width: 12px; height: 16px; border-radius: 2px 4px 4px 2px; background: #F0EDFC; border: 1px solid #1C1C1E"></span></span>
    </button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M10 13h6M13 10l3 3-3 3"/></svg>
      <span style="flex: 1">Move to folder</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 14h6M9 17h4"/></svg>
      <span style="flex: 1">Export as PDF</span>
    </button>
    <div style="height: 1.5px; background: #EFEEEA; margin: 6px 4px"></div>
    <button class="rb mi" role="menuitem" style="width: 100%; height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; color: #C42F1E">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Move to Trash</button>
    <div style="margin: 6px 12px 4px; font-size: 11px; color: #6B6B70">24 pages · 3.2 MB · edited today, 1:51 PM</div>
  </div>

  <div style="position: absolute; left: 540px; top: 230px; width: 220px; font-family: Inter, sans-serif; font-weight: 500; font-size: 14px; color: #FFFFFF; line-height: 1.1">
    ← long-press lifts the notebook with a lime glow, menu opens beside it
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
