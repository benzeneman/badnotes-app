<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New notebook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #1C1C1E;outline-offset:3px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
  <div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(22,22,26,.5); backdrop-filter: blur(5px)"></div>

  <div role="dialog" aria-label="New notebook" style="position: absolute; left: 160px; top: 84px; width: 960px; height: 632px; display: flex; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); overflow: hidden">

    <!-- Live preview -->
    <div style="width: 330px; background-color: #F2F2EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; color: #1C1C1E">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: #6E56CF">LIVE PREVIEW</div>
      <div style="position: relative; width: 200px; height: 272px">
        <div style="position: absolute; left: 28px; top: 10px; width: 192px; height: 262px; border-radius: 4px 12px 12px 4px; border: 1px solid #E7E6E1; background: {{paperBg}}; transform: rotate(6deg)"></div>
        <div style="position: absolute; inset: 0; border: 1px solid #E7E6E1; border-radius: 6px 16px 16px 6px; overflow: hidden; background: {{coverBg}}; box-shadow: 0 20px 40px rgba(0,0,0,.18)">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: rgba(22,22,26,.22)"></div>
          <div style="position: absolute; left: 30px; right: 14px; bottom: 18px; background: #FFFFFF; border: 1px solid #E7E6E1; border-radius: 10px; padding: 8px 10px; font-family: Inter, sans-serif; font-weight: 700; font-size: 17px; color: #1C1C1E; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{title}}</div>
        </div>
      </div>
      <div style="font-size: 13px; color: #6B6B70">{{summary}}</div>
    </div>

    <!-- Options -->
    <div style="flex: 1; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-family: Inter, sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.6px">New notebook</h2>
        <button class="rb" aria-label="Close" style="width: 40px; height: 40px; border-radius: 50%; background: #F2F2EF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <div>
        <label for="nbname" style="display: block; font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 6px">Name</label>
        <input id="nbname" value="{{name}}" onChange="{{onName}}" placeholder="Untitled notebook" style="all: unset; box-sizing: border-box; width: 100%; height: 48px; padding: 0 16px; border: 1px solid #E7E6E1; border-radius: 14px; font-size: 16px; font-weight: 600">
      </div>

      <div>
        <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 8px">Cover</div>
        <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{covers}}" as="c" hint-placeholder-count="8">
            <button class="rb" aria-label="{{c.label}}" onClick="{{c.pick}}" style="height: 70px; border: 1px solid #E7E6E1; border-radius: 4px 10px 10px 4px; background: {{c.bg}}; box-shadow: {{c.ring}}"></button>
          </sc-for>
          <button class="rb" aria-label="Use a photo as cover" style="height: 70px; border: 1.5px dashed #CFCEC8; border-radius: 4px 10px 10px 4px; display: flex; align-items: center; justify-content: center; color: #3F3F39">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg></button>
        </div>
      </div>

      <div>
        <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 8px">Paper</div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{papers}}" as="p" hint-placeholder-count="5">
            <button class="rb" onClick="{{p.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px">
              <span style="display: block; width: 72px; height: 94px; border: 1px solid #E7E6E1; border-radius: 6px; background: {{p.bg}}; box-shadow: {{p.ring}}"></span>
              <span style="font-size: 12px; font-weight: {{p.weight}}">{{p.name}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; gap: 28px">
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 8px">Size</div>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
              <button class="rb" onClick="{{s.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center">{{s.name}}</button>
            </sc-for>
          </div>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 8px">Orientation</div>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{orients}}" as="o" hint-placeholder-count="2">
              <button class="rb" onClick="{{o.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; background: {{o.bg}}; color: {{o.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center">{{o.name}}</button>
            </sc-for>
          </div>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #6B6B70; margin-bottom: 8px">Save in</div>
          <button class="rb" style="height: 36px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">
            <span style="width: 10px; height: 10px; border-radius: 3px; background: #F0EDFC; border: 1px solid #1C1C1E"></span>College
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>

      <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 10px">
        <button class="rb" style="height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #E7E6E1; font-size: 15px; font-weight: 600; display: flex; align-items: center">Cancel</button>
        <button class="rb" style="height: 48px; padding: 0 24px; border-radius: 999px; background: #F0EDFC; border: 1px solid #E7E6E1; box-shadow: 0 10px 30px rgba(0,0,0,.08); font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Create notebook</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cover: 0, paper: 1, size: 0, orient: 0, name: 'Chemistry Notes' };
  }
  renderVals() {
    const COVERS = [
      ['Lavender', '#E8E1FB'], ['Charcoal', '#2B2B30'], ['Blush', '#FBE3DA'], ['Mint', '#DCEFE9'],
      ['Sand', '#F7ECCF'], ['Sky', '#DCE8FB'], ['Rose', '#F8DDE6'], ['Paper', '#FFFFFF']
    ];
    const PAPERS = [
      ['Blank', '#FFFFFF'],
      ['Ruled', 'linear-gradient(#BFD0F0 1px, transparent 1px) 0 12px / 100% 9px, #FFFFFF'],
      ['Grid', 'linear-gradient(#E2E1DC 1px, transparent 1px) 0 0 / 9px 9px, linear-gradient(90deg, #E2E1DC 1px, transparent 1px) 0 0 / 9px 9px, #FFFFFF'],
      ['Dotted', 'radial-gradient(#9C9C93 1px, transparent 1.3px) 0 0 / 9px 9px, #FFFFFF'],
      ['Cornell', 'linear-gradient(90deg, transparent 20px, #FF8A6B 20px 21.5px, transparent 21.5px), linear-gradient(transparent 70px, #FF8A6B 70px 71.5px, transparent 71.5px), linear-gradient(#BFD0F0 1px, transparent 1px) 0 6px / 100% 9px, #FFFFFF']
    ];
    const SIZES = ['A4', 'Letter', 'Infinite'];
    const ORIENTS = ['Portrait', 'Landscape'];
    const s = this.state;
    const ring = '0 0 0 2px #FFFFFF, 0 0 0 4px #6E56CF';
    const chip = (on) => ({ bg: on ? '#F0EDFC' : '#FFFFFF', fg: on ? '#5A43B8' : '#3A3A3F' });
    return {
      name: s.name,
      title: s.name || 'Untitled',
      onName: (e) => this.setState({ name: e.target.value }),
      coverBg: COVERS[s.cover][1],
      paperBg: PAPERS[s.paper][1],
      summary: PAPERS[s.paper][0] + ' paper · ' + SIZES[s.size] + ' · ' + ORIENTS[s.orient],
      covers: COVERS.map((c, i) => ({ label: c[0], bg: c[1], ring: i === s.cover ? ring : 'none', pick: () => this.setState({ cover: i }) })),
      papers: PAPERS.map((p, i) => ({ name: p[0], bg: p[1], ring: i === s.paper ? ring : 'none', weight: i === s.paper ? 700 : 500, pick: () => this.setState({ paper: i }) })),
      sizes: SIZES.map((n, i) => Object.assign({ name: n, pick: () => this.setState({ size: i }) }, chip(i === s.size))),
      orients: ORIENTS.map((n, i) => Object.assign({ name: n, pick: () => this.setState({ orient: i }) }, chip(i === s.orient)))
    };
  }
}
</script>
</body>
</html>
