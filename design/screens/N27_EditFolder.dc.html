<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;family=Lora:wght@500;700&amp;family=JetBrains+Mono:wght@500&amp;family=Nunito:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E56CF;text-decoration:none}a:hover{color:#5A43B8}
.rb{all:unset;box-sizing:border-box;cursor:pointer}
.rb:focus-visible{outline:2px solid #6E56CF;outline-offset:3px}
.pop{position:absolute;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:18px;box-shadow:0 2px 4px rgba(0,0,0,.04),0 18px 48px rgba(0,0,0,.12);padding:16px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#1C1C1E}
.pt{font-family:Inter,sans-serif;font-weight:600;font-size:15px;margin:0;letter-spacing:-.1px}
.ps{font-size:12px;color:#6B6B70;margin-top:2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lab{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#6B6B70;margin-top:14px}
.sl{position:relative;height:22px;margin-top:4px}
.sl .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:#E7E6E1}
.sl .fi{position:absolute;left:0;top:9px;height:4px;border-radius:99px;background:#6E56CF}
.sl .kn{position:absolute;top:1px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
.tg{width:40px;height:24px;border-radius:99px;background:#E2E1DC;position:relative;display:inline-block;flex:none}
.tg i{position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:#6E56CF}
.tg.on i{left:18px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;font-size:13px;font-weight:500}
.ds{font-size:12px;color:#6B6B70;line-height:1.45;margin:-4px 0 6px}
.sep{height:1px;background:#EFEEEA;margin:10px 0}
.sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:#EDEDEA;border-radius:10px}
.sg .rb{height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#55555A}
.sg .rb.on{background:#FFFFFF;color:#1C1C1E;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:64px;border-radius:12px;font-size:12px;font-weight:500;color:#3A3A3F}
.ty.on{background:#F0EDFC;color:#5A43B8;font-weight:600}
.pv{height:80px;border-radius:12px;background:#F6F6F4;display:flex;align-items:center;justify-content:center;margin-top:12px}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:40px;border-radius:10px;padding:0 10px;font-size:13px;font-weight:500;color:#1C1C1E}
.mi:hover{background:#F4F4F1}
.sub{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:#FFFFFF;border:1px solid #E7E6E1;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);font-family:Inter,sans-serif;color:#1C1C1E}
.sb{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#3A3A3F}
.sb.on{background:#F2F2EF}
.pill{height:32px;padding:0 10px;border-radius:9px;background:#F0EDFC;color:#5A43B8;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.vs{width:1px;height:18px;background:#E7E6E1;margin:0 6px}
.sw{width:22px;height:22px;margin:0 4px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px #6E56CF}
.note{position:absolute;font-family:Inter,sans-serif;font-weight:400;font-size:13px;line-height:1.45;color:#3A3A3F;background:#FFFFFF;padding:12px 14px;border:1px solid #E7E6E1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.dim{position:absolute;inset:0;background:rgba(20,20,22,.28);backdrop-filter:blur(4px)}
.chip{height:30px;padding:0 12px;border-radius:8px;border:1px solid #E7E6E1;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:#FFFFFF;color:#3A3A3F}
.chip.on{background:#F0EDFC;color:#5A43B8;border-color:#E0D9FA;font-weight:600}
.btn{height:40px;padding:0 18px;border-radius:10px;border:1px solid #E7E6E1;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#FFFFFF;color:#1C1C1E}
.btn.go{background:#6E56CF;border-color:#6E56CF;color:#FFFFFF;font-weight:600}
.red{color:#D93A2B}

.card{background:#FFFFFF;border:1px solid #E7E6E1;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.8px}
.h2{margin:0;font-size:15px;font-weight:600}
.mut{font-size:12px;color:#6B6B70}
.t{font-size:13px;font-weight:600}
.cv{position:relative;display:block;border-radius:4px 12px 12px 4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.08);overflow:hidden}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.08)}
.cl{position:absolute;left:18px;bottom:12px;font-size:12px;font-weight:600;color:rgba(28,28,30,.75)}
.fd{position:relative;display:block;height:104px}
.ftab{position:absolute;left:0;top:0;width:64px;height:20px;border-radius:10px 10px 0 0}
.fback{position:absolute;left:0;right:0;top:12px;bottom:0;border-radius:0 12px 12px 12px}
.pk{position:absolute;top:18px;width:36px;height:48px;border-radius:2px 5px 5px 2px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ffront{position:absolute;left:0;right:0;bottom:0;height:56px;border-radius:12px;padding:0 14px 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 -1px 0 rgba(255,255,255,.7) inset,0 -4px 10px rgba(0,0,0,.05)}
.dk{height:44px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3A3A3F}
.lr{display:flex;align-items:center;gap:14px;height:64px;padding:0 16px;border-bottom:1px solid #F0EFEB}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #F6F6F4; font-family: Inter, system-ui, sans-serif; color: #1C1C1E">
<div style="position: absolute; inset: 0"><dc-import name="M_Home" hint-size="1280px,800px"></dc-import></div>
<div class="dim"></div>
<div class="pop" role="dialog" aria-label="Edit folder" style="left: 250px; top: 120px; width: 780px; padding: 0; display: flex; overflow: hidden">
  <div style="width: 300px; background: #F6F6F4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
    <span style="position: relative; display: block; width: 200px; height: 150px">
      <span style="position: absolute; left: 0; top: 0; width: 84px; height: 26px; border-radius: 12px 12px 0 0; background: {{back}}"></span>
      <span style="position: absolute; left: 0; right: 0; top: 16px; bottom: 0; border-radius: 0 16px 16px 16px; background: {{back}}"></span>
      <span style="position: absolute; left: 34px; top: 26px; width: 50px; height: 66px; border-radius: 2px 6px 6px 2px; background: #FFFFFF; transform: rotate(-6deg); box-shadow: 0 1px 3px rgba(0,0,0,.12)"></span>
      <span style="position: absolute; left: 88px; top: 22px; width: 50px; height: 66px; border-radius: 2px 6px 6px 2px; background: #E8E1FB; transform: rotate(5deg); box-shadow: 0 1px 3px rgba(0,0,0,.12)"></span>
      <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; border-radius: 16px; background: {{front}}; padding: 0 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 -4px 12px rgba(0,0,0,.06)">
        <span style="position: absolute; right: 14px; top: 14px; width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; color: {{ink}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d}}"/></svg></span>
        <span style="font-size: 17px; font-weight: 600">{{name}}</span><span style="font-size: 12px; color: #6B6B70">12 items</span>
      </span>
    </span>
    <span class="mut" style="font-size: 12px; color: #6B6B70">Live preview</span>
  </div>
  <div style="flex: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px">
    <div class="hd"><h2 class="pt" style="font-size: 17px">Edit folder</h2><button class="rb sb" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="lab" for="fn" style="margin-top: 10px"><span>Name</span><span></span></label>
    <input id="fn" value="{{name}}" onChange="{{onName}}" style="all: unset; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #E7E6E1; font-size: 14px">
    <div class="lab"><span>Color</span><span></span></div>
    <div style="display: flex; gap: 10px; margin-top: 4px"><sc-for list="{{colors}}" as="c" hint-placeholder-count="6"><button class="rb" aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 32px; height: 32px; border-radius: 50%; background: {{c.hex}}; box-shadow: {{c.ring}}"></button></sc-for></div>
    <div class="lab"><span>Icon</span><span>{{iconName}}</span></div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 8px; margin-top: 4px">
      <button class="rb" aria-label="No icon" onClick="{{noIcon}}" style="height: 44px; border-radius: 10px; background: {{noneBg}}; display: flex; align-items: center; justify-content: center; color: #8A8A90; font-size: 11px">None</button>
      <sc-for list="{{icons}}" as="i" hint-placeholder-count="15"><button class="rb" aria-label="{{i.label}}" onClick="{{i.pick}}" style="height: 44px; border-radius: 10px; background: {{i.bg}}; color: {{i.fg}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg></button></sc-for>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; padding-top: 16px"><button class="rb btn">Cancel</button><button class="rb btn go">Save</button></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {

    const CO = [["Lavender", "#CFC2F5", "#E6DEFB", "#5A43B8"], ["Peach", "#F2C2B1", "#FBE3DA", "#A9502F"], ["Mint", "#B5DDD0", "#DCEFE9", "#2A7660"], ["Sand", "#EBD69F", "#F7ECCF", "#7E611A"], ["Sky", "#B9D3F2", "#E3EDFB", "#2B5C9E"], ["Rose", "#EFC1D0", "#F8DDE6", "#9E3E5E"]];
    const s = this.state, c = CO[s.c];
    return {
      name: s.name, onName: e => this.setState({ name: e.target.value }),
      back: c[1], front: c[2], ink: c[3], d: s.i >= 0 ? IC[s.i][2] : '',
      iconName: s.i >= 0 ? IC[s.i][1] : 'none',
      noneBg: s.i < 0 ? '#F0EDFC' : '#F6F6F4', noIcon: () => this.setState({ i: -1 }),
      colors: CO.map((x, i) => ({ label: x[0], hex: x[1], ring: i === s.c ? '0 0 0 2px #FFFFFF, 0 0 0 4px #6E56CF' : 'none', pick: () => this.setState({ c: i }) })),
      icons: IC.map((x, i) => ({ label: x[1], d: x[2], bg: i === s.i ? '#F0EDFC' : '#F6F6F4', fg: i === s.i ? '#5A43B8' : '#3A3A3F', pick: () => this.setState({ i }) }))

</script>
</body>
</html>
