      pleaseAuthorize: Lütfen BadNotes'un Nextcloud hesabınıza erişmesine izin verin
      followPrompts: Lütfen Nextcloud arayüzündeki adımları izleyin
      browserDidntOpen: Giriş sayfası açılmadı mı? Buraya tıklayın
  encLoginStep:
    enterEncPassword: "Verilerinizi korumak için lütfen şifreleme parolanızı girin:"
    newToBadNotes: BadNotes'ta yeni misiniz? Yeni bir şifreleme parolası girmeniz yeterli.
    encPassword: Şifreleme parolası
    encFaqTitle: Sık sorulan sorular
    wrongEncPassword: Girilen parolayla şifre çözülemedi. Lütfen yeniden girmeyi deneyin.
    connectionFailed: Sunucuya bağlanırken bir sorun oluştu. Lütfen daha sonra yeniden deneyin.
    encFaq:
    - q: Şifreleme parolası nedir? Neden iki parola kullanılıyor?
      a: |-
        Buluta erişmek için Google veya Microsoft hesabınız kullanılır. Şifreleme parolası ise verileriniz buluta ulaşmadan önce onları "karıştırır".
        Biri Google veya Microsoft hesabınıza erişse bile notlarınız ayrı bir parolayla şifrelenmiş ve güvende kalır. Bu, verilerinizi korumak için size ikinci bir güvenlik katmanı sağlar.
        Şifreleme parolanız olmadan kimse sunucudaki notlarınıza erişemez; ancak bu, şifreleme parolanızı unutursanız verilerinize erişiminizi kaybedeceğiniz anlamına da gelir.
    - q: Henüz bir şifreleme parolası belirlemedim. Nereden alabilirim?
      a: |-
        Yeni bir şifreleme parolası seçin ve yukarıya girin.
        BadNotes şifreleme anahtarlarınızı bu paroladan otomatik olarak oluşturur.
    - q: Google veya Microsoft hesabımla aynı parolayı kullanabilir miyim?
      a: Lütfen kullanmayın. Ayrı bir şifreleme parolası, biri o hesaba girse bile notlarınızı güvende tutar.
profile:
  title: Profilim
  logout: Çıkış yap
  quotaUsage: $total alanın $used kadarını kullanıyorsunuz (%$percent)
  quotaUsageUncapped: $used kullanıyorsunuz
  connectedTo: Bağlı olunan
  lastSynced: Son eşitleme $time
  notSyncedYet: Henüz eşitlenmedi
  justNow: az önce
  minutesAgo: $n dk önce
  hoursAgo: $n sa önce
  filesWaiting: $n dosya eşitlenmeyi bekliyor
  signInAgainNeeded: Eşitlemeye devam etmek için yeniden giriş yapın
  signInAgain: Yeniden giriş yap
  wrongAccount: Lütfen $email hesabını seçin
  quickLinks:
    serverHomepage: Sunucu ana sayfası
    deleteAccount: Hesabı sil
  faqTitle: Sık sorulan sorular
  faq:
  - q: Çıkış yaparsam notlarımı kaybeder miyim?
    a: Hayır. Notlarınız hem cihazınızda hem de sunucuda kalır. Yeniden giriş yapana kadar sunucuyla eşitlenmezler. Veri kaybetmemek için çıkış yapmadan önce eşitlemenin bittiğinden emin olun (eşitleme durumunu ana ekranda görebilirsiniz).
  - q: Notlarım nerede saklanıyor?
    a: Google Drive'ınızdaki "BadNotes" klasöründe veya OneDrive'ınızdaki "Apps/BadNotes" klasöründe. Dosyalar şifrelidir, bu yüzden yalnızca BadNotes'ta açılabilir.
  - q: Şifreleme parolamı nasıl değiştiririm?
    a: |-
      0. Eşitlemenin bittiğinden emin olun (eşitleme durumunu ana ekranda görebilirsiniz).
      1. BadNotes'tan çıkış yapın.
      2. Google Drive veya OneDrive'ınızdaki 'BadNotes' klasörünü silin. Bu, tüm notlarınızı cihazınızdan değil, buluttan siler.
      3. BadNotes'a yeniden giriş yapın. Giriş yaparken yeni bir şifreleme parolası seçebilirsiniz.
      4. Diğer cihazlarınızda da BadNotes'tan çıkış yapıp yeniden giriş yapmayı unutmayın.
  - q: Hesabımı nasıl silebilirim?
    a: |-
      BadNotes'un kendine ait bir hesabı yoktur. Çıkış yapın, ardından Google Drive veya OneDrive'ınızdaki 'BadNotes' klasörünü silin.
      BadNotes'un erişimini de kaldırmak için myaccount.google.com/permissions (Google) veya account.live.com/consent/Manage (Microsoft) adresine gidin.
