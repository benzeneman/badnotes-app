    otherNcServer: Другой сервер Nextcloud
    serverUrl: Адрес сервера
    loginWithBadNotes: Войти через BadNotes
    loginWithNextcloud: Войти через Nextcloud
    loginFlow:
      pleaseAuthorize: Разрешите BadNotes доступ к вашему аккаунту Nextcloud
      followPrompts: Следуйте подсказкам в интерфейсе Nextcloud
      browserDidntOpen: Страница входа не открылась? Нажмите здесь
  encLoginStep:
    enterEncPassword: "Для защиты данных введите пароль шифрования:"
    newToBadNotes: Впервые в BadNotes? Просто придумайте новый пароль шифрования.
    encPassword: Пароль шифрования
    encFaqTitle: Частые вопросы
    wrongEncPassword: Не удалось расшифровать данные с этим паролем. Попробуйте ввести его ещё раз.
    connectionFailed: Не удалось подключиться к серверу. Попробуйте позже.
    encFaq:
    - q: Что такое пароль шифрования? Зачем два пароля?
      a: |-
        Аккаунт Google или Microsoft нужен для доступа к облаку. Пароль шифрования «перемешивает» ваши данные ещё до того, как они попадут в облако.
        Даже если кто-то получит доступ к вашему аккаунту Google или Microsoft, заметки останутся в безопасности, ведь они зашифрованы отдельным паролем. Это второй уровень защиты ваших данных.
        Без пароля шифрования никто не сможет открыть ваши заметки на сервере, но это значит и то, что, забыв пароль шифрования, вы потеряете доступ к своим данным.
    - q: Я ещё не задавал пароль шифрования. Где его взять?
      a: |-
        Придумайте новый пароль шифрования и введите его выше.
        BadNotes автоматически создаст из него ключи шифрования.
    - q: Можно ли использовать тот же пароль, что и для аккаунта Google или Microsoft?
      a: Лучше не надо. Отдельный пароль шифрования защитит заметки, даже если кто-то войдёт в этот аккаунт.
profile:
  title: Мой профиль
  logout: Выйти
  quotaUsage: Использовано $used из $total ($percent%)
  quotaUsageUncapped: Использовано $used
  connectedTo: Подключено к
  lastSynced: Синхронизировано $time
  notSyncedYet: Ещё не синхронизировано
  justNow: только что
  minutesAgo: $n мин назад
  hoursAgo: $n ч назад
  filesWaiting: "Файлов ожидает синхронизации: $n"
  signInAgainNeeded: Войдите снова, чтобы продолжить синхронизацию
  signInAgain: Войти снова
  wrongAccount: Выберите $email
  quickLinks:
    serverHomepage: Сайт сервера
    deleteAccount: Удалить аккаунт
  faqTitle: Частые вопросы
  faq:
  - q: Потеряю ли я заметки, если выйду из аккаунта?
    a: Нет. Заметки останутся и на устройстве, и на сервере, но не будут синхронизироваться, пока вы не войдёте снова. Перед выходом дождитесь окончания синхронизации, чтобы не потерять данные (ход синхронизации виден на главном экране).
  - q: Где хранятся мои заметки?
    a: В папке «BadNotes» на Google Drive или «Apps/BadNotes» в OneDrive. Файлы зашифрованы, поэтому открыть их можно только в BadNotes.
  - q: Как сменить пароль шифрования?
    a: |-
      0. Дождитесь окончания синхронизации (ход синхронизации виден на главном экране).
      1. Выйдите из BadNotes.
      2. Удалите папку «BadNotes» на Google Drive или в OneDrive. Это удалит все заметки из облака, но не с устройства.
      3. Снова войдите в BadNotes. При входе можно задать новый пароль шифрования.
      4. Не забудьте выйти и снова войти в BadNotes и на других устройствах.
  - q: Как удалить аккаунт?
    a: |-
      У BadNotes нет собственного аккаунта. Выйдите, затем удалите папку «BadNotes» на Google Drive или в OneDrive.
      Чтобы также отозвать доступ BadNotes, откройте myaccount.google.com/permissions (Google) или account.live.com/consent/Manage (Microsoft).
