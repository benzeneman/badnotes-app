    otherNcServer: Autre serveur Nextcloud
    serverUrl: URL du serveur
    loginWithBadNotes: Se connecter avec BadNotes
    loginWithNextcloud: Se connecter avec Nextcloud
    loginFlow:
      pleaseAuthorize: Autorisez BadNotes à accéder à votre compte Nextcloud
      followPrompts: Suivez les instructions dans l'interface de Nextcloud
      browserDidntOpen: La page de connexion ne s'est pas ouverte ? Cliquez ici
  encLoginStep:
    enterEncPassword: "Pour protéger vos données, saisissez votre mot de passe de chiffrement :"
    newToBadNotes: Nouveau sur BadNotes ? Saisissez simplement un nouveau mot de passe de chiffrement.
    encPassword: Mot de passe de chiffrement
    encFaqTitle: Questions fréquentes
    wrongEncPassword: Le déchiffrement a échoué avec ce mot de passe. Veuillez le saisir à nouveau.
    connectionFailed: Un problème est survenu lors de la connexion au serveur. Veuillez réessayer plus tard.
    encFaq:
    - q: Qu'est-ce qu'un mot de passe de chiffrement ? Pourquoi deux mots de passe ?
      a: |-
        Votre compte Google ou Microsoft sert à accéder au cloud. Le mot de passe de chiffrement « brouille » vos données avant même qu'elles n'atteignent le cloud.
        Même si quelqu'un accède à votre compte Google ou Microsoft, vos notes restent protégées et chiffrées par un mot de passe distinct. Vous bénéficiez ainsi d'un second niveau de sécurité pour vos données.
        Personne ne peut lire vos notes sur le serveur sans votre mot de passe de chiffrement. Mais cela signifie aussi que si vous l'oubliez, vous perdrez l'accès à vos données.
    - q: Je n'ai pas encore de mot de passe de chiffrement. Où le trouver ?
      a: |-
        Choisissez un nouveau mot de passe de chiffrement et saisissez-le ci-dessus.
        BadNotes générera automatiquement vos clés de chiffrement à partir de ce mot de passe.
    - q: Puis-je utiliser le même mot de passe que pour mon compte Google ou Microsoft ?
      a: Mieux vaut éviter. Un mot de passe de chiffrement distinct protège vos notes même si quelqu'un accède à ce compte.
profile:
  title: Mon profil
  logout: Se déconnecter
  quotaUsage: Vous utilisez $used sur $total ($percent%)
  quotaUsageUncapped: Vous utilisez $used
