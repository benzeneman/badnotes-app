  ncLoginStep:
    whereToStoreData: "Choisissez où stocker vos données :"
    cloudStorage: Google Drive ou OneDrive
    loginWithGoogleDrive: Continuer avec Google Drive
    loginWithOneDrive: Continuer avec OneDrive
    cloudLoginFailed: Connexion impossible
