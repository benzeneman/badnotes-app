  minutesAgo: il y a $n min
  hoursAgo: il y a $n h
  filesWaiting: $n fichiers en attente de synchronisation
  signInAgainNeeded: Reconnectez-vous pour continuer la synchronisation
  signInAgain: Se reconnecter
  wrongAccount: Veuillez choisir $email
  quickLinks:
    serverHomepage: Page d'accueil du serveur
    deleteAccount: Supprimer le compte
  faqTitle: Questions fréquentes
  faq:
  - q: Vais-je perdre mes notes si je me déconnecte ?
    a: Non. Vos notes restent sur votre appareil et sur le serveur. Elles ne seront plus synchronisées avec le serveur tant que vous ne vous reconnecterez pas. Attendez la fin de la synchronisation avant de vous déconnecter pour ne perdre aucune donnée (la progression s'affiche sur l'écran d'accueil).
  - q: Où sont stockées mes notes ?
    a: Dans un dossier « BadNotes » de votre Google Drive, ou « Apps/BadNotes » dans votre OneDrive. Les fichiers sont chiffrés et ne peuvent donc être ouverts que dans BadNotes.
  - q: Comment changer mon mot de passe de chiffrement ?
    a: |-
      0. Attendez la fin de la synchronisation (la progression s'affiche sur l'écran d'accueil).
      1. Déconnectez-vous de BadNotes.
      2. Supprimez le dossier « BadNotes » de votre Google Drive ou OneDrive. Cela supprime toutes vos notes du cloud, pas de votre appareil.
      3. Reconnectez-vous à BadNotes. Vous pourrez choisir un nouveau mot de passe de chiffrement lors de la connexion.
      4. N'oubliez pas de vous déconnecter puis de vous reconnecter à BadNotes sur vos autres appareils.
  - q: Comment supprimer mon compte ?
    a: |-
      BadNotes n'a pas de compte propre. Déconnectez-vous, puis supprimez le dossier « BadNotes » de votre Google Drive ou OneDrive.
      Pour retirer aussi l'accès de BadNotes, rendez-vous sur myaccount.google.com/permissions (Google) ou account.live.com/consent/Manage (Microsoft).
