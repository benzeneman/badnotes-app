      browserDidntOpen: Trang đăng nhập không mở? Nhấn vào đây
  encLoginStep:
    enterEncPassword: "Để bảo vệ dữ liệu, vui lòng nhập mật khẩu mã hóa của bạn:"
    newToBadNotes: Mới dùng BadNotes? Chỉ cần nhập một mật khẩu mã hóa mới.
    encPassword: Mật khẩu mã hóa
    encFaqTitle: Câu hỏi thường gặp
    wrongEncPassword: Giải mã thất bại với mật khẩu đã nhập. Vui lòng thử nhập lại.
    connectionFailed: Đã xảy ra lỗi khi kết nối tới máy chủ. Vui lòng thử lại sau.
    encFaq:
    - q: Mật khẩu mã hóa là gì? Tại sao cần hai mật khẩu?
      a: |-
        Tài khoản Google hoặc Microsoft của bạn dùng để truy cập đám mây. Mật khẩu mã hóa sẽ "xáo trộn" dữ liệu của bạn trước khi nó được gửi lên đám mây.
        Ngay cả khi ai đó truy cập được tài khoản Google hoặc Microsoft của bạn, ghi chú vẫn an toàn và được mã hóa bằng một mật khẩu riêng. Đây là lớp bảo mật thứ hai để bảo vệ dữ liệu của bạn.
        Không ai có thể xem ghi chú của bạn trên máy chủ nếu không có mật khẩu mã hóa, nhưng điều này cũng có nghĩa là nếu bạn quên mật khẩu mã hóa, bạn sẽ mất quyền truy cập dữ liệu.
    - q: Tôi chưa đặt mật khẩu mã hóa. Lấy nó ở đâu?
      a: |-
        Hãy chọn một mật khẩu mã hóa mới và nhập vào ô phía trên.
        BadNotes sẽ tự động tạo khóa mã hóa từ mật khẩu này.
    - q: Tôi có thể dùng mật khẩu giống tài khoản Google hoặc Microsoft không?
      a: Xin đừng. Một mật khẩu mã hóa riêng giúp ghi chú của bạn an toàn ngay cả khi ai đó vào được tài khoản đó.
profile:
  title: Hồ sơ của tôi
  logout: Đăng xuất
  quotaUsage: Bạn đang dùng $used trên $total ($percent%)
  quotaUsageUncapped: Bạn đang dùng $used
