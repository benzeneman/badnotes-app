  filesWaiting: $n tệp đang chờ đồng bộ
  signInAgainNeeded: Đăng nhập lại để tiếp tục đồng bộ
  signInAgain: Đăng nhập lại
  wrongAccount: Vui lòng chọn $email
  quickLinks:
    serverHomepage: Trang chủ máy chủ
    deleteAccount: Xóa tài khoản
  faqTitle: Câu hỏi thường gặp
  faq:
  - q: Tôi có mất ghi chú nếu đăng xuất không?
    a: Không. Ghi chú của bạn vẫn còn trên cả thiết bị và máy chủ. Chúng sẽ không được đồng bộ với máy chủ cho đến khi bạn đăng nhập lại. Hãy đảm bảo đồng bộ đã xong trước khi đăng xuất để không mất dữ liệu (xem tiến trình đồng bộ trên màn hình chính).
  - q: Ghi chú của tôi được lưu ở đâu?
    a: Trong thư mục "BadNotes" trên Google Drive, hoặc "Apps/BadNotes" trên OneDrive của bạn. Các tệp đã được mã hóa nên chỉ có thể mở bằng BadNotes.
  - q: Làm sao để đổi mật khẩu mã hóa?
    a: |-
      0. Đảm bảo đồng bộ đã xong (xem tiến trình đồng bộ trên màn hình chính).
      1. Đăng xuất khỏi BadNotes.
      2. Xóa thư mục 'BadNotes' trên Google Drive hoặc OneDrive. Thao tác này xóa mọi ghi chú trên đám mây, không xóa trên thiết bị của bạn.
      3. Đăng nhập lại BadNotes. Bạn có thể chọn mật khẩu mã hóa mới khi đăng nhập.
      4. Đừng quên đăng xuất rồi đăng nhập lại BadNotes trên các thiết bị khác.
  - q: Làm sao để xóa tài khoản?
    a: |-
      BadNotes không có tài khoản riêng. Hãy đăng xuất, rồi xóa thư mục 'BadNotes' trên Google Drive hoặc OneDrive.
      Để thu hồi cả quyền truy cập của BadNotes, hãy vào myaccount.google.com/permissions (Google) hoặc account.live.com/consent/Manage (Microsoft).
