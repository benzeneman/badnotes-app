  ncLoginStep:
    whereToStoreData: "Wähle, wo deine Daten gespeichert werden sollen:"
    cloudStorage: Google Drive oder OneDrive
    loginWithGoogleDrive: Weiter mit Google Drive
    loginWithOneDrive: Weiter mit OneDrive
    cloudLoginFailed: Anmeldung fehlgeschlagen
    comingSoon: Demnächst verfügbar
    badnotesNcServer: Nextcloud-Server von BadNotes
    otherNcServer: Anderer Nextcloud-Server
    serverUrl: Server-URL
    loginWithBadNotes: Mit BadNotes anmelden
    loginWithNextcloud: Mit Nextcloud anmelden
    loginFlow:
      pleaseAuthorize: Bitte erlaube BadNotes den Zugriff auf dein Nextcloud-Konto
      followPrompts: Bitte folge den Anweisungen in der Nextcloud-Oberfläche
      browserDidntOpen: Anmeldeseite nicht geöffnet? Hier klicken
  encLoginStep:
    enterEncPassword: "Gib zum Schutz deiner Daten bitte dein Verschlüsselungspasswort ein:"
    newToBadNotes: Neu bei BadNotes? Gib einfach ein neues Verschlüsselungspasswort ein.
    encPassword: Verschlüsselungspasswort
    encFaqTitle: Häufig gestellte Fragen
    wrongEncPassword: Entschlüsselung mit diesem Passwort fehlgeschlagen. Bitte versuche es erneut.
    connectionFailed: Bei der Verbindung zum Server ist ein Fehler aufgetreten. Bitte versuche es später erneut.
    encFaq:
    - q: Was ist ein Verschlüsselungspasswort? Warum zwei Passwörter?
      a: |-
        Dein Google- oder Microsoft-Konto dient dem Zugriff auf die Cloud. Das Verschlüsselungspasswort „verschlüsselt“ deine Daten, bevor sie überhaupt in die Cloud gelangen.
        Selbst wenn jemand Zugriff auf dein Google- oder Microsoft-Konto erhält, bleiben deine Notizen sicher und mit einem separaten Passwort verschlüsselt. So hast du eine zweite Sicherheitsebene für deine Daten.
        Ohne dein Verschlüsselungspasswort kann niemand auf deine Notizen auf dem Server zugreifen. Das bedeutet aber auch: Wenn du dein Verschlüsselungspasswort vergisst, verlierst du den Zugriff auf deine Daten.
    - q: Ich habe noch kein Verschlüsselungspasswort festgelegt. Woher bekomme ich es?
      a: |-
        Wähle ein neues Verschlüsselungspasswort und gib es oben ein.
        BadNotes erzeugt deine Verschlüsselungsschlüssel automatisch aus diesem Passwort.
    - q: Kann ich dasselbe Passwort wie für mein Google- oder Microsoft-Konto verwenden?
      a: Bitte nicht. Ein separates Verschlüsselungspasswort schützt deine Notizen auch dann, wenn jemand in dieses Konto eindringt.
profile:
  title: Mein Profil
  logout: Abmelden
  quotaUsage: Du nutzt $used von $total ($percent %)
  quotaUsageUncapped: Du nutzt $used
  connectedTo: Verbunden mit
  lastSynced: Zuletzt synchronisiert $time
  notSyncedYet: Noch nicht synchronisiert
  justNow: gerade eben
  minutesAgo: vor $n Min.
  hoursAgo: vor $n Std.
  filesWaiting: $n Dateien warten auf Synchronisierung
  signInAgainNeeded: Melde dich erneut an, um weiter zu synchronisieren
  signInAgain: Erneut anmelden
  wrongAccount: Bitte wähle $email
  quickLinks:
    serverHomepage: Server-Startseite
    deleteAccount: Konto löschen
  faqTitle: Häufig gestellte Fragen
  faq:
  - q: Verliere ich meine Notizen, wenn ich mich abmelde?
    a: Nein. Deine Notizen bleiben sowohl auf deinem Gerät als auch auf dem Server. Sie werden erst wieder mit dem Server synchronisiert, wenn du dich erneut anmeldest. Stelle vor dem Abmelden sicher, dass die Synchronisierung abgeschlossen ist, damit keine Daten verloren gehen (siehe Synchronisierungsfortschritt auf dem Startbildschirm).
  - q: Wo werden meine Notizen gespeichert?
    a: In einem Ordner „BadNotes“ in deinem Google Drive oder „Apps/BadNotes“ in deinem OneDrive. Die Dateien sind verschlüsselt und lassen sich nur in BadNotes öffnen.
  - q: Wie ändere ich mein Verschlüsselungspasswort?
    a: |-
      0. Stelle sicher, dass die Synchronisierung abgeschlossen ist (siehe Synchronisierungsfortschritt auf dem Startbildschirm).
      1. Melde dich von BadNotes ab.
      2. Lösche den Ordner „BadNotes“ in deinem Google Drive oder OneDrive. Dadurch werden alle deine Notizen aus der Cloud gelöscht, nicht von deinem Gerät.
      3. Melde dich wieder bei BadNotes an. Bei der Anmeldung kannst du ein neues Verschlüsselungspasswort wählen.
      4. Vergiss nicht, dich auch auf deinen anderen Geräten bei BadNotes ab- und wieder anzumelden.
  - q: Wie kann ich mein Konto löschen?
    a: |-
      BadNotes hat kein eigenes Konto. Melde dich ab und lösche dann den Ordner „BadNotes“ in deinem Google Drive oder OneDrive.
      Um BadNotes auch den Zugriff zu entziehen, besuche myaccount.google.com/permissions (Google) oder account.live.com/consent/Manage (Microsoft).
