  ncLoginStep:
    whereToStoreData: データの保存先を選択してください：
    cloudStorage: Google Drive または OneDrive
    loginWithGoogleDrive: Google Drive で続ける
    loginWithOneDrive: OneDrive で続ける
    cloudLoginFailed: サインインできませんでした
    comingSoon: 近日公開
    badnotesNcServer: BadNotes の Nextcloud サーバー
    otherNcServer: その他の Nextcloud サーバー
    serverUrl: サーバー URL
    loginWithBadNotes: BadNotes でログイン
    loginWithNextcloud: Nextcloud でログイン
    loginFlow:
      pleaseAuthorize: BadNotes による Nextcloud アカウントへのアクセスを許可してください
      followPrompts: Nextcloud の画面の指示に従ってください
      browserDidntOpen: ログインページが開きませんか？ここをクリック
  encLoginStep:
    enterEncPassword: データを保護するため、暗号化パスワードを入力してください：
    newToBadNotes: BadNotes を初めてお使いの場合は、新しい暗号化パスワードを入力するだけです。
    encPassword: 暗号化パスワード
    encFaqTitle: よくある質問
    wrongEncPassword: 入力したパスワードで復号できませんでした。もう一度入力してください。
    connectionFailed: サーバーへの接続中に問題が発生しました。しばらくしてからもう一度お試しください。
    encFaq:
    - q: 暗号化パスワードとは何ですか？なぜパスワードが 2 つ必要なのですか？
      a: |-
        Google または Microsoft アカウントはクラウドへのアクセスに使用されます。暗号化パスワードは、データがクラウドに届く前にデータを「スクランブル」します。
        誰かがあなたの Google または Microsoft アカウントにアクセスできたとしても、ノートは別のパスワードで暗号化されたまま安全に保たれます。これにより、データを守るための第 2 のセキュリティ層が加わります。
        暗号化パスワードがなければ、誰もサーバー上のノートにアクセスできません。ただしこれは、暗号化パスワードを忘れるとデータにアクセスできなくなることも意味します。
    - q: まだ暗号化パスワードを設定していません。どこで入手できますか？
      a: |-
        新しい暗号化パスワードを決めて、上に入力してください。
        BadNotes がこのパスワードから暗号化キーを自動で生成します。
    - q: Google または Microsoft アカウントと同じパスワードを使えますか？
      a: おすすめしません。別の暗号化パスワードにしておけば、そのアカウントに誰かが侵入してもノートは安全です。
profile:
  title: マイプロフィール
  logout: ログアウト
  quotaUsage: $total 中 $used を使用中（$percent%）
  quotaUsageUncapped: $used を使用中
  connectedTo: 接続先
  lastSynced: 最終同期：$time
  notSyncedYet: まだ同期されていません
  justNow: たった今
  minutesAgo: $n 分前
  hoursAgo: $n 時間前
  filesWaiting: $n 件のファイルが同期待ちです
  signInAgainNeeded: 同期を続けるには再度サインインしてください
  signInAgain: 再度サインイン
  wrongAccount: $email を選択してください
  quickLinks:
    serverHomepage: サーバーのホームページ
    deleteAccount: アカウントを削除
  faqTitle: よくある質問
  faq:
  - q: ログアウトするとノートは消えますか？
    a: いいえ。ノートはデバイスとサーバーの両方に残ります。再度ログインするまでサーバーとは同期されません。データを失わないよう、ログアウトする前に同期が完了していることを確認してください（同期の進行状況はホーム画面で確認できます）。
  - q: ノートはどこに保存されますか？
    a: Google Drive の「BadNotes」フォルダ、または OneDrive の「Apps/BadNotes」に保存されます。ファイルは暗号化されているため、BadNotes でしか開けません。
  - q: 暗号化パスワードを変更するにはどうすればよいですか？
    a: |-
      0. 同期が完了していることを確認します（同期の進行状況はホーム画面で確認できます）。
      1. BadNotes からログアウトします。
      2. Google Drive または OneDrive の「BadNotes」フォルダを削除します。これによりクラウド上のノートはすべて削除されますが、デバイス上のノートは削除されません。
      3. BadNotes に再度ログインします。ログイン時に新しい暗号化パスワードを設定できます。
      4. 他のデバイスでも BadNotes からログアウトし、再度ログインするのを忘れないでください。
  - q: アカウントを削除するにはどうすればよいですか？
    a: |-
      BadNotes には独自のアカウントはありません。ログアウトしてから、Google Drive または OneDrive の「BadNotes」フォルダを削除してください。
      BadNotes のアクセス権も取り消すには、myaccount.google.com/permissions（Google）または account.live.com/consent/Manage（Microsoft）にアクセスしてください。
