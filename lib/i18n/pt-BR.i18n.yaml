    serverUrl: URL do servidor
    loginWithBadNotes: Entrar com o BadNotes
    loginWithNextcloud: Entrar com o Nextcloud
    loginFlow:
      pleaseAuthorize: Autorize o BadNotes a acessar sua conta do Nextcloud
      followPrompts: Siga as instruções na interface do Nextcloud
      browserDidntOpen: A página de login não abriu? Clique aqui
  encLoginStep:
    enterEncPassword: "Para proteger seus dados, digite sua senha de criptografia:"
    newToBadNotes: Novo no BadNotes? É só digitar uma nova senha de criptografia.
    encPassword: Senha de criptografia
    encFaqTitle: Perguntas frequentes
    wrongEncPassword: Não foi possível descriptografar com a senha informada. Tente digitá-la novamente.
    connectionFailed: Algo deu errado ao conectar ao servidor. Tente novamente mais tarde.
    encFaq:
    - q: O que é uma senha de criptografia? Por que usar duas senhas?
      a: |-
        Sua conta do Google ou da Microsoft é usada para acessar a nuvem. A senha de criptografia "embaralha" seus dados antes mesmo de eles chegarem à nuvem.
        Mesmo que alguém consiga acessar sua conta do Google ou da Microsoft, suas notas continuarão seguras e criptografadas com uma senha separada. Isso oferece uma segunda camada de segurança para proteger seus dados.
        Ninguém consegue acessar suas notas no servidor sem a sua senha de criptografia, mas isso também significa que, se você esquecer essa senha, perderá o acesso aos seus dados.
    - q: Ainda não defini uma senha de criptografia. Onde consigo uma?
      a: |-
        Escolha uma nova senha de criptografia e digite-a acima.
        O BadNotes vai gerar suas chaves de criptografia a partir dessa senha automaticamente.
    - q: Posso usar a mesma senha da minha conta do Google ou da Microsoft?
      a: Melhor não. Uma senha de criptografia separada mantém suas notas seguras mesmo que alguém invada essa conta.
profile:
  title: Meu perfil
  logout: Sair
  quotaUsage: Você está usando $used de $total ($percent%)
  quotaUsageUncapped: Você está usando $used
  connectedTo: Conectado a
  lastSynced: Última sincronização $time
