    loggedIn: Sincronização ativada
  ncLoginStep:
    whereToStoreData: "Escolha onde guardar seus dados:"
    cloudStorage: Google Drive ou OneDrive
    loginWithGoogleDrive: Continuar com o Google Drive
    loginWithOneDrive: Continuar com o OneDrive
    cloudLoginFailed: Não foi possível entrar
    comingSoon: Em breve
    badnotesNcServer: Servidor Nextcloud do BadNotes
