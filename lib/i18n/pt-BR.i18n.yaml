  minutesAgo: há $n min
  hoursAgo: há $n h
  filesWaiting: $n arquivos aguardando sincronização
  signInAgainNeeded: Entre novamente para continuar sincronizando
  signInAgain: Entrar novamente
  wrongAccount: Escolha $email
  quickLinks:
    serverHomepage: Página inicial do servidor
    deleteAccount: Excluir conta
  faqTitle: Perguntas frequentes
  faq:
  - q: Vou perder minhas notas se eu sair?
    a: Não. Suas notas continuarão no seu dispositivo e no servidor. Elas não serão sincronizadas com o servidor até você entrar novamente. Aguarde a sincronização terminar antes de sair para não perder dados (veja o progresso da sincronização na tela inicial).
  - q: Onde minhas notas ficam guardadas?
    a: Em uma pasta "BadNotes" no seu Google Drive, ou em "Apps/BadNotes" no seu OneDrive. Os arquivos são criptografados, então só podem ser abertos no BadNotes.
  - q: Como altero minha senha de criptografia?
    a: |-
      0. Aguarde a sincronização terminar (veja o progresso da sincronização na tela inicial).
      1. Saia do BadNotes.
      2. Exclua a pasta 'BadNotes' do seu Google Drive ou OneDrive. Isso exclui todas as suas notas da nuvem, não do seu dispositivo.
      3. Entre novamente no BadNotes. Você poderá escolher uma nova senha de criptografia ao entrar.
      4. Não se esqueça de sair e entrar novamente no BadNotes nos seus outros dispositivos também.
  - q: Como posso excluir minha conta?
    a: |-
      O BadNotes não tem conta própria. Saia e depois exclua a pasta 'BadNotes' do seu Google Drive ou OneDrive.
      Para também remover o acesso do BadNotes, acesse myaccount.google.com/permissions (Google) ou account.live.com/consent/Manage (Microsoft).
