  ncLoginStep:
    whereToStoreData: 选择数据的存储位置：
    cloudStorage: Google Drive 或 OneDrive
    loginWithGoogleDrive: 通过 Google Drive 继续
    loginWithOneDrive: 通过 OneDrive 继续
    cloudLoginFailed: 无法登录
    comingSoon: 即将推出
    badnotesNcServer: BadNotes 的 Nextcloud 服务器
    otherNcServer: 其他 Nextcloud 服务器
    serverUrl: 服务器地址
    loginWithBadNotes: 使用 BadNotes 登录
    loginWithNextcloud: 使用 Nextcloud 登录
    loginFlow:
      pleaseAuthorize: 请授权 BadNotes 访问你的 Nextcloud 账号
      followPrompts: 请按照 Nextcloud 界面中的提示操作
      browserDidntOpen: 登录页面没有打开？点击这里
  encLoginStep:
    enterEncPassword: 为保护你的数据，请输入加密密码：
    newToBadNotes: 首次使用 BadNotes？直接输入一个新的加密密码即可。
    encPassword: 加密密码
    encFaqTitle: 常见问题
    wrongEncPassword: 使用该密码解密失败，请重新输入。
    connectionFailed: 连接服务器时出错，请稍后重试。
    encFaq:
    - q: 什么是加密密码？为什么要用两个密码？
      a: |-
        你的 Google 或 Microsoft 账号用于访问云端。加密密码会在数据上传到云端之前将其"打乱"。
        即使有人获取了你的 Google 或 Microsoft 账号，你的笔记仍会通过单独的密码加密，保持安全。这为你的数据提供了第二层保护。
        没有你的加密密码，任何人都无法访问服务器上的笔记；但这也意味着，如果你忘记了加密密码，将无法再访问你的数据。
    - q: 我还没有设置加密密码，去哪里获取？
      a: |-
        选择一个新的加密密码并在上方输入即可。
        BadNotes 会根据此密码自动生成你的加密密钥。
    - q: 我可以使用与 Google 或 Microsoft 账号相同的密码吗？
      a: 请不要这样做。单独的加密密码可以在该账号被他人登录时仍保护你的笔记安全。
profile:
  title: 我的资料
  logout: 退出登录
  quotaUsage: 已使用 $used / $total（$percent%）
  quotaUsageUncapped: 已使用 $used
  connectedTo: 已连接到
  lastSynced: 上次同步：$time
  notSyncedYet: 尚未同步
  justNow: 刚刚
  minutesAgo: $n 分钟前
  hoursAgo: $n 小时前
  filesWaiting: $n 个文件等待同步
  signInAgainNeeded: 请重新登录以继续同步
  signInAgain: 重新登录
  wrongAccount: 请选择 $email
  quickLinks:
    serverHomepage: 服务器主页
    deleteAccount: 删除账号
  faqTitle: 常见问题
  faq:
  - q: 退出登录会丢失笔记吗？
    a: 不会。你的笔记会同时保留在设备和服务器上，但在你重新登录之前不会与服务器同步。退出登录前请确保同步已完成，以免丢失数据（可在首页查看同步进度）。
  - q: 我的笔记存储在哪里？
    a: 存储在 Google Drive 的"BadNotes"文件夹中，或 OneDrive 的"Apps/BadNotes"中。这些文件已加密，因此只能在 BadNotes 中打开。
  - q: 如何更改加密密码？
    a: |-
      0. 确保同步已完成（可在首页查看同步进度）。
      1. 退出 BadNotes 登录。
      2. 删除 Google Drive 或 OneDrive 中的"BadNotes"文件夹。这会删除云端的所有笔记，但不会删除设备上的笔记。
      3. 重新登录 BadNotes。登录时可以设置新的加密密码。
      4. 别忘了在其他设备上也退出并重新登录 BadNotes。
  - q: 如何删除我的账号？
    a: |-
      BadNotes 没有自己的账号体系。退出登录，然后删除 Google Drive 或 OneDrive 中的"BadNotes"文件夹即可。
      如需同时撤销 BadNotes 的访问权限，请前往 myaccount.google.com/permissions（Google）或 account.live.com/consent/Manage（Microsoft）。
