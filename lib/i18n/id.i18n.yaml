  signInAgainNeeded: Masuk lagi untuk melanjutkan sinkronisasi
  signInAgain: Masuk lagi
  wrongAccount: Pilih $email
  quickLinks:
    serverHomepage: Beranda server
    deleteAccount: Hapus akun
  faqTitle: Pertanyaan umum
  faq:
  - q: Apakah catatan saya akan hilang jika saya keluar?
    a: Tidak. Catatan Anda tetap ada di perangkat dan di server. Catatan tidak akan disinkronkan dengan server sampai Anda masuk lagi. Pastikan sinkronisasi selesai sebelum keluar agar tidak ada data yang hilang (lihat progres sinkronisasi di layar beranda).
  - q: Di mana catatan saya disimpan?
    a: Di folder "BadNotes" di Google Drive Anda, atau "Apps/BadNotes" di OneDrive Anda. File-file tersebut terenkripsi, jadi hanya bisa dibuka di BadNotes.
  - q: Bagaimana cara mengganti kata sandi enkripsi?
    a: |-
      0. Pastikan sinkronisasi selesai (lihat progres sinkronisasi di layar beranda).
      1. Keluar dari BadNotes.
      2. Hapus folder 'BadNotes' di Google Drive atau OneDrive Anda. Ini menghapus semua catatan Anda dari cloud, bukan dari perangkat Anda.
      3. Masuk lagi ke BadNotes. Anda bisa memilih kata sandi enkripsi baru saat masuk.
      4. Jangan lupa keluar lalu masuk lagi ke BadNotes di perangkat Anda yang lain juga.
  - q: Bagaimana cara menghapus akun saya?
    a: |-
      BadNotes tidak memiliki akun sendiri. Keluar, lalu hapus folder 'BadNotes' di Google Drive atau OneDrive Anda.
      Untuk mencabut juga akses BadNotes, buka myaccount.google.com/permissions (Google) atau account.live.com/consent/Manage (Microsoft).
