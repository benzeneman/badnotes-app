  ncLoginStep:
    whereToStoreData: "Pilih tempat menyimpan data Anda:"
    cloudStorage: Google Drive atau OneDrive
    loginWithGoogleDrive: Lanjutkan dengan Google Drive
    loginWithOneDrive: Lanjutkan dengan OneDrive
