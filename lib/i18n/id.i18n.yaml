    comingSoon: Segera hadir
    badnotesNcServer: Server Nextcloud BadNotes
    otherNcServer: Server Nextcloud lain
    serverUrl: URL server
    loginWithBadNotes: Masuk dengan BadNotes
    loginWithNextcloud: Masuk dengan Nextcloud
    loginFlow:
      pleaseAuthorize: Izinkan BadNotes mengakses akun Nextcloud Anda
      followPrompts: Ikuti petunjuk di antarmuka Nextcloud
      browserDidntOpen: Halaman masuk tidak terbuka? Klik di sini
  encLoginStep:
    enterEncPassword: "Untuk melindungi data Anda, masukkan kata sandi enkripsi:"
    newToBadNotes: Baru di BadNotes? Cukup masukkan kata sandi enkripsi baru.
    encPassword: Kata sandi enkripsi
    encFaqTitle: Pertanyaan umum
    wrongEncPassword: Dekripsi gagal dengan kata sandi tersebut. Coba masukkan lagi.
    connectionFailed: Terjadi kesalahan saat menghubungkan ke server. Coba lagi nanti.
    encFaq:
    - q: Apa itu kata sandi enkripsi? Kenapa perlu dua kata sandi?
      a: |-
        Akun Google atau Microsoft Anda dipakai untuk mengakses cloud. Kata sandi enkripsi "mengacak" data Anda sebelum sampai ke cloud.
        Meskipun seseorang berhasil mengakses akun Google atau Microsoft Anda, catatan Anda tetap aman dan terenkripsi dengan kata sandi terpisah. Ini memberi lapisan keamanan kedua untuk melindungi data Anda.
        Tidak ada yang bisa mengakses catatan Anda di server tanpa kata sandi enkripsi, tetapi ini juga berarti jika Anda lupa kata sandi enkripsi, Anda akan kehilangan akses ke data Anda.
    - q: Saya belum membuat kata sandi enkripsi. Dari mana saya mendapatkannya?
      a: |-
        Buat kata sandi enkripsi baru dan masukkan di atas.
        BadNotes akan membuat kunci enkripsi Anda dari kata sandi ini secara otomatis.
    - q: Bolehkah saya memakai kata sandi yang sama dengan akun Google atau Microsoft saya?
      a: Sebaiknya jangan. Kata sandi enkripsi terpisah menjaga catatan Anda tetap aman meskipun seseorang berhasil masuk ke akun tersebut.
profile:
  title: Profil saya
  logout: Keluar
  quotaUsage: Anda menggunakan $used dari $total ($percent%)
  quotaUsageUncapped: Anda menggunakan $used
