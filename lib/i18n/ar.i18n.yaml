  hoursAgo: منذ $n س
  filesWaiting: $n ملفات بانتظار المزامنة
  signInAgainNeeded: سجّل الدخول مجددًا لمتابعة المزامنة
  signInAgain: تسجيل الدخول مجددًا
  wrongAccount: يُرجى اختيار $email
  quickLinks:
    serverHomepage: الصفحة الرئيسية للخادم
    deleteAccount: حذف الحساب
  faqTitle: الأسئلة الشائعة
  faq:
  - q: هل سأفقد ملاحظاتي إذا سجّلت الخروج؟
    a: لا. ستبقى ملاحظاتك على جهازك وعلى الخادم معًا، لكنها لن تُزامَن مع الخادم حتى تسجّل الدخول مجددًا. تأكد من اكتمال المزامنة قبل تسجيل الخروج حتى لا تفقد أي بيانات (راجع تقدم المزامنة في الشاشة الرئيسية).
  - q: أين تُخزَّن ملاحظاتي؟
    a: في مجلد "BadNotes" على Google Drive، أو "Apps/BadNotes" على OneDrive. الملفات مشفرة، لذا لا يمكن فتحها إلا في BadNotes.
  - q: كيف أغيّر كلمة مرور التشفير؟
    a: |-
      0. تأكد من اكتمال المزامنة (راجع تقدم المزامنة في الشاشة الرئيسية).
      1. سجّل الخروج من BadNotes.
      2. احذف مجلد 'BadNotes' من Google Drive أو OneDrive. هذا يحذف جميع ملاحظاتك من السحابة، وليس من جهازك.
      3. سجّل الدخول مجددًا إلى BadNotes. يمكنك اختيار كلمة مرور تشفير جديدة أثناء تسجيل الدخول.
      4. لا تنسَ تسجيل الخروج ثم الدخول مجددًا إلى BadNotes على أجهزتك الأخرى أيضًا.
  - q: كيف يمكنني حذف حسابي؟
    a: |-
      ليس لدى BadNotes حساب خاص به. سجّل الخروج، ثم احذف مجلد 'BadNotes' من Google Drive أو OneDrive.
      ولإلغاء وصول BadNotes أيضًا، انتقل إلى myaccount.google.com/permissions (Google) أو account.live.com/consent/Manage (Microsoft).
