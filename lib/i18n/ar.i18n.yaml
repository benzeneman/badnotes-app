    loginFlow:
      pleaseAuthorize: يُرجى السماح لـ BadNotes بالوصول إلى حسابك على Nextcloud
      followPrompts: يُرجى اتباع التعليمات في واجهة Nextcloud
      browserDidntOpen: لم تُفتح صفحة تسجيل الدخول؟ اضغط هنا
  encLoginStep:
    enterEncPassword: "لحماية بياناتك، يُرجى إدخال كلمة مرور التشفير:"
    newToBadNotes: جديد على BadNotes؟ ما عليك سوى إدخال كلمة مرور تشفير جديدة.
    encPassword: كلمة مرور التشفير
    encFaqTitle: الأسئلة الشائعة
    wrongEncPassword: فشل فك التشفير بكلمة المرور المُدخلة. يُرجى المحاولة مرة أخرى.
    connectionFailed: حدث خطأ أثناء الاتصال بالخادم. يُرجى المحاولة لاحقًا.
    encFaq:
    - q: ما كلمة مرور التشفير؟ ولماذا كلمتا مرور؟
      a: |-
        يُستخدم حسابك على Google أو Microsoft للوصول إلى السحابة. أما كلمة مرور التشفير فتُشفّر بياناتك قبل أن تصل إلى السحابة.
        حتى لو تمكّن أحد من الوصول إلى حسابك على Google أو Microsoft، ستبقى ملاحظاتك آمنة ومشفرة بكلمة مرور منفصلة. وهذا يمنحك طبقة حماية ثانية لبياناتك.
        لا يستطيع أحد الوصول إلى ملاحظاتك على الخادم دون كلمة مرور التشفير، لكن هذا يعني أيضًا أنك إذا نسيتها فستفقد الوصول إلى بياناتك.
    - q: لم أُعيّن كلمة مرور تشفير بعد. من أين أحصل عليها؟
      a: |-
        اختر كلمة مرور تشفير جديدة وأدخلها أعلاه.
        سيُنشئ BadNotes مفاتيح التشفير من كلمة المرور هذه تلقائيًا.
    - q: هل يمكنني استخدام كلمة مرور حسابي على Google أو Microsoft نفسها؟
      a: يُرجى عدم ذلك. كلمة مرور تشفير منفصلة تحافظ على أمان ملاحظاتك حتى لو تمكّن أحد من الدخول إلى ذلك الحساب.
profile:
  title: ملفي الشخصي
  logout: تسجيل الخروج
  quotaUsage: أنت تستخدم $used من $total ($percent%)
  quotaUsageUncapped: أنت تستخدم $used
