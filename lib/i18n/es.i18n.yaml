  signInAgainNeeded: Vuelve a iniciar sesión para seguir sincronizando
  signInAgain: Volver a iniciar sesión
  wrongAccount: Elige $email
  quickLinks:
    serverHomepage: Página principal del servidor
    deleteAccount: Eliminar cuenta
  faqTitle: Preguntas frecuentes
  faq:
  - q: ¿Perderé mis notas si cierro sesión?
    a: No. Tus notas seguirán en tu dispositivo y en el servidor. No se sincronizarán con el servidor hasta que vuelvas a iniciar sesión. Asegúrate de que la sincronización haya terminado antes de cerrar sesión para no perder datos (consulta el progreso de sincronización en la pantalla de inicio).
  - q: ¿Dónde se guardan mis notas?
    a: En una carpeta "BadNotes" de tu Google Drive, o en "Apps/BadNotes" de tu OneDrive. Los archivos están cifrados, así que solo se pueden abrir en BadNotes.
  - q: ¿Cómo cambio mi contraseña de cifrado?
    a: |-
      0. Asegúrate de que la sincronización haya terminado (consulta el progreso de sincronización en la pantalla de inicio).
      1. Cierra sesión en BadNotes.
      2. Elimina la carpeta 'BadNotes' de tu Google Drive o OneDrive. Esto elimina todas tus notas de la nube, no de tu dispositivo.
      3. Vuelve a iniciar sesión en BadNotes. Podrás elegir una nueva contraseña de cifrado al iniciar sesión.
      4. No olvides cerrar sesión y volver a iniciarla en BadNotes también en tus otros dispositivos.
  - q: ¿Cómo puedo eliminar mi cuenta?
    a: |-
      BadNotes no tiene cuentas propias. Cierra sesión y elimina la carpeta 'BadNotes' de tu Google Drive o OneDrive.
      Para quitar también el acceso de BadNotes, ve a myaccount.google.com/permissions (Google) o account.live.com/consent/Manage (Microsoft).
