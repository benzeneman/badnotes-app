  ncLoginStep:
    whereToStoreData: "Elige dónde quieres guardar tus datos:"
    cloudStorage: Google Drive o OneDrive
    loginWithGoogleDrive: Continuar con Google Drive
    loginWithOneDrive: Continuar con OneDrive
    cloudLoginFailed: No se pudo iniciar sesión
