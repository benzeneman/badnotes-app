    loginFlow:
      pleaseAuthorize: Autoriza a BadNotes a acceder a tu cuenta de Nextcloud
      followPrompts: Sigue las instrucciones en la interfaz de Nextcloud
      browserDidntOpen: ¿No se abrió la página de inicio de sesión? Haz clic aquí
  encLoginStep:
    enterEncPassword: "Para proteger tus datos, introduce tu contraseña de cifrado:"
    newToBadNotes: ¿Eres nuevo en BadNotes? Solo tienes que introducir una nueva contraseña de cifrado.
    encPassword: Contraseña de cifrado
    encFaqTitle: Preguntas frecuentes
    wrongEncPassword: No se pudo descifrar con la contraseña indicada. Vuelve a introducirla.
    connectionFailed: Algo salió mal al conectar con el servidor. Inténtalo de nuevo más tarde.
    encFaq:
    - q: ¿Qué es una contraseña de cifrado? ¿Por qué usar dos contraseñas?
      a: |-
        Tu cuenta de Google o Microsoft se usa para acceder a la nube. La contraseña de cifrado "codifica" tus datos antes de que lleguen a la nube.
        Aunque alguien consiga acceder a tu cuenta de Google o Microsoft, tus notas seguirán seguras y cifradas con otra contraseña. Esto te da una segunda capa de seguridad para proteger tus datos.
        Nadie puede acceder a tus notas en el servidor sin tu contraseña de cifrado, pero esto también significa que, si la olvidas, perderás el acceso a tus datos.
    - q: Todavía no he creado una contraseña de cifrado. ¿Dónde la consigo?
      a: |-
        Elige una nueva contraseña de cifrado e introdúcela arriba.
        BadNotes generará automáticamente tus claves de cifrado a partir de esta contraseña.
    - q: ¿Puedo usar la misma contraseña que la de mi cuenta de Google o Microsoft?
      a: Mejor no. Una contraseña de cifrado distinta mantiene tus notas seguras aunque alguien entre en esa cuenta.
profile:
  title: Mi perfil
  logout: Cerrar sesión
  quotaUsage: Estás usando $used de $total ($percent%)
  quotaUsageUncapped: Estás usando $used
  connectedTo: Conectado a
  lastSynced: Última sincronización $time
